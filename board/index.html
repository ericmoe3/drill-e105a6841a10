<title>Schedule Board Game</title>
<style>
:root{
  --ink:#1f2328; --ink2:#59616b; --line:#d9dce1; --line2:#eceef1; --bg:#fff; --ghead:#c9ccd1; --off:#f1f2f4;
  --blue:#cfe7f8; --blueb:#7fb8e2; --sel:#1b4f8a; --red:#d93025; --redbg:#fde8e6; --amber:#f2a100; --green:#2e8540;
  --chip:#f3f4f6; --name:180px; --rowh:44px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;height:100%;height:100dvh}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.btn{border:1px solid #b9bec6;background:#fff;border-radius:8px;padding:7px 12px;min-height:38px}
.btn.pri{background:#1b6ac9;border-color:#1b6ac9;color:#fff;font-weight:600}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.btn.warn{background:#fff4f3;border-color:#f1b3ad;color:#a1271d}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.date{display:flex;align-items:center;gap:8px;border:1px solid #b9bec6;border-radius:8px;padding:0 12px;min-height:38px;font-weight:500;min-width:170px}
.arrow{width:38px;padding:0;font-size:20px}
.sp{flex:1}
.internal{font-size:11px;font-weight:700;letter-spacing:.06em;color:#a1271d;text-transform:uppercase}
.prompt{border-bottom:1px solid var(--line);padding:10px 12px;background:#fbfbfc;display:flex;gap:12px;align-items:flex-start}
.prompt .pbody{flex:1;min-width:0}
.ptag{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.ptag b{background:#1f2328;color:#fff;border-radius:999px;padding:2px 9px;font-size:11px;letter-spacing:.02em}
.ptitle{font-size:16px;font-weight:700;margin:3px 0 2px}
.quote{border-left:3px solid #9fb6cf;padding:2px 0 2px 9px;margin:6px 0;color:#2b3440;font-style:italic}
.who2{font-size:12px;color:var(--ink2);font-style:normal}
.task{margin:4px 0 0}
.pact{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:140px}
.timer{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink2);text-align:center}
.errs{margin-top:8px;border:1px solid #f1b3ad;background:var(--redbg);border-radius:8px;padding:8px 10px}
.errs h4{margin:0 0 4px;font-size:13px;color:#a1271d}
.errs ol{margin:0;padding-left:20px}
.errs li{margin:3px 0;cursor:pointer}
.errs li small{display:block;color:#6b2a24}
.collapse{font-size:12px;color:#1b6ac9;background:none;border:0;padding:0}
.tray{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:#fff8e6;overflow-x:auto}
.tray .lbl{font-weight:700;font-size:12px;white-space:nowrap;color:#7a5200}
.board{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.grid{position:relative;min-width:100%}
.thead{position:sticky;top:0;z-index:6;display:flex;background:#fff;border-bottom:1px solid var(--line);height:30px}
.corner{position:sticky;left:0;z-index:7;width:var(--name);min-width:var(--name);background:#fff;border-right:1px solid var(--line)}
.ticks{position:relative;flex:1}
.tick{position:absolute;top:8px;font-size:12px;color:var(--ink2);transform:translateX(-50%);white-space:nowrap}
.ghead{background:var(--ghead);height:32px;border-bottom:1px solid #b5b9bf;cursor:pointer;user-select:none;-webkit-user-select:none}
.ghead span{position:sticky;left:0;display:inline-block;padding:7px 12px;font-weight:700;white-space:nowrap}
.row{display:flex;border-bottom:1px solid var(--line2);position:relative}
.who{position:sticky;left:0;z-index:5;width:var(--name);min-width:var(--name);background:#fff;border-right:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:4px 8px;cursor:pointer}
.av{width:30px;height:30px;border-radius:50%;background:#e6ebf1;border:2px solid #9bc46a;display:grid;place-items:center;font-size:11px;font-weight:700;color:#3b4a5c;flex:none}
.av.out{border-color:#c9ccd1}
.who b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(var(--name) - 52px)}
.who small{display:block;color:var(--ink2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(var(--name) - 52px)}
.lane{position:relative;flex:1}
.lane.target{background:repeating-linear-gradient(90deg,transparent 0,transparent 14px,rgba(27,106,201,.05) 14px,rgba(27,106,201,.05) 15px)}
.lane.ok{box-shadow:inset 4px 0 0 #2e8540}
.lane.no{opacity:.5}
.offz{position:absolute;top:0;bottom:0;background:var(--off)}
.nowl{position:absolute;top:0;bottom:0;border-left:1px dashed #b9bec6}
.blk{position:absolute;top:5px;bottom:5px;border-radius:4px;background:#7a7f86;color:#fff;font-size:12px;padding:6px 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:1px solid #5d6168}
.blk.azbook{background:#dff3d3;color:#33532a;border-color:#b8dca6;font-size:10px;line-height:1.15;white-space:normal;padding:2px 6px}
.blk.off{background:#c4c9d0;color:#3d434b;border-color:#b0b6be;text-align:center}
.job{position:absolute;height:34px;border-radius:4px;background:var(--blue);border:1px solid var(--blueb);display:flex;align-items:center;gap:3px;padding:0 6px;font-size:12px;white-space:nowrap;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;z-index:2}
.job .nm{overflow:hidden;text-overflow:ellipsis;margin-left:2px}
.job .az{color:#6a5200;font-size:11px;margin-left:4px}
.job.sel{outline:3px solid var(--sel);outline-offset:0;z-index:4}
.job.pj{border:2px dashed var(--amber)}
.job.err{border:2px solid var(--red);animation:flash 1s ease-in-out 3}
.job.err.sel{outline-color:var(--red)}
.job.drag{opacity:.85;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:20;pointer-events:none}
.job .rz{position:absolute;right:0;top:0;bottom:0;width:14px;cursor:ew-resize;background:linear-gradient(90deg,transparent,rgba(27,79,138,.35))}

@keyframes flash{50%{background:#ffc9c3}}
.bd{display:inline-block;font-size:10.5px;font-weight:700;line-height:15px;padding:0 4px;border-radius:3px;white-space:nowrap}
.bd.cy{background:#3fcbe4;color:#0d3440}
.bd.pk{background:#ff3fb0;color:#fff}
.bd.wa{background:#2f6fe0;color:#fff}
.bd.azs{background:#f5c33b;color:#3c2c00}
.bd.gs{background:#6fd9ea;color:#0d3440}
.bd.tg{background:#e3e6ea;color:#2c333b}
.bd.wt{background:#0b63c7;color:#fff}
.bd.pt{background:#f08a24;color:#fff}
.bd.cm{background:#5b6470;color:#fff}
.bd.dm{background:#7d4dd8;color:#fff}
.bd.ye{background:#ffe066;color:#3c2c00}
.drv{position:absolute;top:50%;height:0;border-top:2px dotted #6b9bd1}
.drv.bad{border-top:3px solid var(--red)}
.drv i{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;font-style:normal;color:#4a6b8f;white-space:nowrap;background:rgba(255,255,255,.85);padding:0 2px;border-radius:3px}
.drv.bad i{color:var(--red);font-weight:700}

}

const TECH = {}; TECHS.forEach(t => { TECH[t.id] = t; });
const NO_SCHEDULE = ['Dwayne', 'Robi', 'Eric'];
const PAY_LABEL = { fill: 'Fill first', flex: 'Flex', sales: 'Estimates & rescue', new: 'New tech' };

function shiftOf(tech, dow) {
  const g = GROUP[tech.g];
  if (g.st === 'AZ') return { s: 420, e: 900 };   // 7–3 on the board in winter = 8–4 AZ
  return { s: 480, e: 960 };                      // WA 8–4
}
function worksOn(tech, dow) { return (tech.days || WEEKDAYS).indexOf(dow) !== -1; }

/* ---------------- geography + drive model (from the Dispatch Drill, ST clocked drives Jun–Sep 2026) ---------------- */
const SHOP = { WA: { ll: [47.7987, -122.3267], name: 'Mountlake Terrace shop' }, AZ: { ll: [33.444, -111.8414], name: 'Mesa shop' } };
const MODEL = { WA: { a: 7, b: 2.58, p: 0.8, lake: 4 }, AZ: { a: 7.4544, b: 1.9169, p: 0.8, lake: 0 } };
let CITY = {};   // 'WA|Seattle' -> {lat, lon, minutes (observed shop drive), sector}
function setCities(list) { CITY = {}; list.forEach(c => { CITY[c.m + '|' + c.city] = c; }); }
function hav(a, b) { const r = Math.PI / 180, dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r; const x = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) ** 2; return 12742 * Math.asin(Math.sqrt(x)); }
const eastside = p => p[0] > 47.50 && p[0] < 47.78 && p[1] > -122.235;
const westLake = p => p[0] > 47.48 && p[0] < 47.78 && p[1] < -122.25;
function modelDrive(st, a, b) {
  const m = MODEL[st]; const k = hav(a, b); if (k < 0.05) return 0;
  let v = m.a + m.b * Math.pow(k, m.p);
  if (st === 'WA' && m.lake && ((westLake(a) && eastside(b)) || (eastside(a) && westLake(b)))) v += m.lake;
  return Math.round(v);
}
function jobLL(j) { return j.inShop ? SHOP[j.st].ll : [j.lat, j.lon]; }
function shopDrive(j) {
  if (j.inShop) return 0;
  const c = CITY[j.st + '|' + j.city];
  return c ? c.minutes : modelDrive(j.st, SHOP[j.st].ll, jobLL(j));
}
function legDrive(a, b) {
  if (a.inShop && b.inShop) return 0;
  return modelDrive(a.st, jobLL(a), jobLL(b));
}

/* ---------------- job length ---------------- */
function colIdx(cols, tech) { const i = tech && tech.col ? cols.indexOf(tech.col) : -1; return i < 0 ? 0 : i; }
function piecesMin(p) { let m = 0; Object.keys(p || {}).forEach(k => { m += (PIECES[k] ? PIECES[k].min : 0) * p[k]; }); return Math.ceil(m / 15) * 15; }
// Minutes this tech books for this job. Returns {min, why}.
function reqLen(job, tech) {
  if (FIXED[job.svc]) return { min: FIXED[job.svc], why: SVC[job.svc].label + ' always books ' + hrs(FIXED[job.svc]) + '.' };
  if (job.svc === 'furn') { const m = piecesMin(job.pieces); return { min: m, why: 'Furniture only: add up the pieces (' + piecesText(job.pieces) + '), rounded up to the next 15 min.' }; }
  if (job.svc === 'dv') { const m = job.st === 'AZ' ? 90 : (job.dvLong ? 90 : 60); return { min: m, why: (job.st === 'AZ' ? 'AZ dryer vent' : job.dvLong ? 'WA dryer vent over 10 ft' : 'WA dryer vent under 10 ft') + ' books ' + hrs(m) + '.' }; }
  const who = tech ? tech.name.split(' ')[0] : 'STANDARD';
  if (job.st === 'WA') {
    if (job.svc === 'carpet') { const i = colIdx(WA_CARPET_COLS, tech); const h = WA_CARPET_AREAS[Math.min(10, job.areas)][i]; return { min: h * 60, why: job.areas + ' areas, ' + (i ? who + '\'s column' : 'STANDARD column') + ': ' + h + ' hrs.' }; }
    if (WA_CARPET_OTHER[job.svc]) { const i = colIdx(WA_CARPET_COLS, tech); const h = WA_CARPET_OTHER[job.svc][i]; return { min: h * 60, why: SVC[job.svc].label + ', ' + (i ? who + '\'s column' : 'STANDARD column') + ': ' + h + ' hrs.' }; }
    if (job.svc === 'duct') { const i = colIdx(DUCT_COLS, tech); const h = WA_DUCT[job.tier][job.sq][i]; return { min: h * 60, why: (job.tier === 'D' ? 'Diamond' : 'Essential') + ' ' + SQFT[job.sq] + ' sq ft, ' + (i ? who + '\'s column' : 'STANDARD column') + ': ' + h + ' hrs.' }; }
  } else {
    if (job.svc === 'carpet') { const h = AZ_CARPET_AREAS[Math.max(3, Math.min(6, job.areas))]; return { min: h * 60, why: 'AZ ' + job.areas + ' areas: ' + h + ' hrs (STANDARD and Dominic match).' }; }
    if (AZ_CARPET_OTHER[job.svc]) { const h = AZ_CARPET_OTHER[job.svc]; return { min: h * 60, why: 'AZ ' + SVC[job.svc].label.toLowerCase() + ': ' + h + ' hrs.' }; }
    if (job.svc === 'duct') { const h = AZ_DUCT[job.tier][job.sq]; return { min: h * 60, why: 'AZ ' + (job.tier === 'D' ? 'Diamond' : 'Essential') + ' ' + SQFT[job.sq] + ' sq ft: ' + h + ' hrs.' }; }
  }
  return { min: 120, why: 'Default 2 hrs.' };
}
function piecesText(p) { return Object.keys(p || {}).filter(k => p[k]).map(k => p[k] + ' ' + PIECES[k].label.toLowerCase() + (p[k] > 1 ? 's' : '')).join(', '); }

/* ---------------- formatting ---------------- */
function clock(m, ampm) { m = Math.round(m); const h = Math.floor(m / 60), mm = m % 60; return (h % 12 || 12) + (mm ? ':' + String(mm).padStart(2, '0') : '') + (ampm === false ? '' : (h >= 12 ? ' PM' : ' AM')); }
function clockFull(m) { m = Math.round(m); const h = Math.floor(m / 60), mm = m % 60; return (h % 12 || 12) + ':' + String(mm).padStart(2, '0') + ' ' + (h >= 12 ? 'PM' : 'AM'); }
function hrs(m) { const h = m / 60; return (Number.isInteger(h) ? h : h.toFixed(h * 4 % 1 ? 2 : 1).replace(/0$/, '')) + (h === 1 ? ' hr' : ' hrs'); }
function dur(m) { m = Math.round(m); const h = Math.floor(m / 60), mm = m % 60; return h ? (mm ? h + 'h ' + mm + 'm' : h + 'h') : mm + 'm'; }
function winText(w, st) {
  if (!w) return '—';
  const off = st === 'AZ' ? 60 : 0;
  if (w.s === w.e) return clockFull(w.s + off) + ' sharp';
  return clock(w.s + off, false) + '–' + clock(w.e + off);
}
function winBoth(w, st) { return st === 'AZ' ? winText(w, 'WA') + ' board · ' + winText(w, 'AZ') + ' AZ' : winText(w, 'WA'); }

/* ---------------- arrival windows ---------------- */
// Allowed: 8:00 sharp (local only), 8–9, or a 2-hour window starting on the hour. Sean: 8–12 or 12–4 only. AZ is one hour earlier on the board.
function windowsFor(tech, st) {
  const S = st === 'AZ' ? 420 : 480;
  if (tech && tech.seanWin) return [{ s: 480, e: 720 }, { s: 720, e: 960 }];
  const out = [{ s: S, e: S, sharp: true }, { s: S, e: S + 60 }];
  for (let h = S; h <= S + 360; h += 60) out.push({ s: h, e: h + 120 });
  return out;
}
function winAllowed(w, tech, st) {
  return windowsFor(tech, st).some(x => x.s === w.s && x.e === w.e);
}
function sameWin(a, b) { return !!a && !!b && a.s === b.s && a.e === b.e; }

/* ---------------- static fit: can this tech ever take this job? ---------------- */
// Returns list of {code, text, fix}; empty = qualified.
function fitProblems(job, tech) {
  const g = GROUP[tech.g], out = [];
  if (g.noJobs) { out.push({ code: 'NO_SCHEDULE', text: tech.name + ' is ' + (tech.id === 'kio' ? 'leadership' : 'not a field tech') + ' and never gets jobs.', fix: 'Pick a field tech. Dwayne, Robi, Eric and Kio never get jobs.' }); return out; }
  if (g.st !== job.st) out.push({ code: 'STATE', text: job.st + ' job on ' + g.st + ' tech ' + tech.name + '.', fix: job.st + ' jobs stay with ' + job.st + ' techs.' });
  if (g.skills.indexOf(job.svc) === -1) out.push({ code: 'SKILL', text: tech.name + ' (' + shortGroup(g) + ') does not do ' + SVC[job.svc].label.toLowerCase() + '.', fix: skillFix(job) });
  if (job.water && !g.water) out.push({ code: 'WATER', text: 'This job needs water on board. ' + tech.name + '\'s truck has none.', fix: 'Water-on-board jobs go to the WA CC Big Super Carpet (WATER on board) group.' });
  if (job.portable && !g.portable) out.push({ code: 'PORTABLE', text: 'This job needs a portable. ' + tech.name + '\'s group is no-portable.', fix: 'Portable jobs never go to a no-portable group (Big Super Carpet, Cab-Over).' });
  if (tech.resOnly && job.commercial) out.push({ code: 'RES_ONLY', text: tech.name + ' is residential only. This is a commercial job.', fix: 'Give commercial, HOA, condo and property-management work to someone else.' });
  return out;
}
function skillFix(job) {
  const k = SVC[job.svc].kind;
  if (job.svc === 'rug-shop') return 'In-shop rug drop-offs go to the WA Area Rug In Shop row.';
  if (job.svc === 'est-com') return 'Commercial estimates go to Sean (WA) or Isaiah (AZ).';
  if (k === 'duct') return 'Ducts and dryer vents go to a VM (duct) tech.';
  return 'Carpet, tile, furniture, rugs and hardwood go to a carpet (CC) tech.';
}
function shortGroup(g) { return g.name.replace(/\s*\(BOOK ONE HOUR.*$/, '').replace(/\(\s*NO WATER on truck\)/, '(no water)').replace(/WATER On Board\(No-Portable\)/, 'water, no portable'); }

/* ---------------- full evaluation ---------------- */
// state: {days:[{date, dow, label, blocks:[{tech, s, e, label, kind}]}], jobs:[...], prompt?}
// job: {id, cust, city, st, lat, lon, inShop, svc, areas, sq, tier, pieces, dvLong, water, portable, commercial, value, tags,
//       status:'active'|'cancelled', day, tech, start, len, win:{s,e,sharp}, promise:{day,s,e}|null, req, flex, mustCancel}
function placed(j) { return j.status === 'active' && j.tech != null && j.day != null; }
function techDayJobs(state, techId, day) {
  return state.jobs.filter(j => placed(j) && j.tech === techId && j.day === day).sort((a, b) => a.start - b.start || a.id.localeCompare(b.id));
}
function earliestStart(job, tech) {
  const sh = shiftOf(tech);
  return Math.max(sh.s, sh.s - 30 + shopDrive(job));
}

function evaluate(state, opts) {
  opts = opts || {};
  const errors = [], warns = [];
  const E = (code, job, tech, text, fix) => errors.push({ code, job: job ? job.id : null, tech: tech ? tech.id : null, text, fix });
  const W = (code, job, tech, text, fix, pts) => warns.push({ code, job: job ? job.id : null, tech: tech ? tech.id : null, text, fix, pts: pts == null ? 3 : pts });
  const P = state.prompt || {};

  state.jobs.forEach(j => {
    if (j.status === 'cancelled') return;
    if (j.mustCancel) E('NOT_CANCELLED', j, null, j.cust + ' cancelled, but the job is still on the board.', 'Open the job and tap Cancel job.');
    if (j.tech == null || j.day == null) {
      if (j.parked) return;   // later-day job sitting where it was (not on the board in view)
      E('NEEDS_TECH', j, null, j.cust + ' (' + j.city + ') has no tech.', 'Give it to a qualified tech, or move it to another day.');
      return;
    }
    const t = TECH[j.tech], g = GROUP[t.g], day = state.days[j.day];
    fitProblems(j, t).forEach(p => E(p.code, j, t, p.text, p.fix));
    if (g.noJobs) return;
    if (!worksOn(t, day.dow)) E('DAY_OFF', j, t, t.name + ' is off on ' + day.label + '.', 'Pick a tech who works that day.');
    (day.blocks || []).forEach(b => {
      if (b.tech === t.id && b.kind !== 'azbook' && j.start < b.e && j.start + j.len > b.s)
        E(b.kind === 'callout' ? 'CALL_OUT' : b.kind === 'off' ? 'DAY_OFF' : 'BLOCKED', j, t, j.cust + ' sits on ' + t.name + '\'s "' + b.label + '" block.', 'No jobs on call-out, day-off or DO NOT MOVE time. Move it to another tech.');
    });
    // length
    const r = reqLen(j, t);
    if (j.len !== r.min) E('LENGTH', j, t, 'Timing needs to be adjusted for this block based on ' + t.name.split(' ')[0] + '\'s skill and timing. ' + r.why + ' Booked: ' + hrs(j.len) + '.', 'Resize the block to ' + hrs(r.min) + '.');
    // window type
    if (!winAllowed(j.win, t, j.st)) {
      if (t.seanWin) E('SEAN_WINDOW', j, t, 'Sean Cook\'s window is ' + winText(j.win, 'WA') + '.', 'When a CCR books Sean, the window is exactly 8 AM–12 PM or 12–4 PM.');
      else E('WINDOW_TYPE', j, t, winBoth(j.win, j.st) + ' is not a window we book.', 'Use 8:00 sharp (local only), 8–9, or a 2-hour window on the hour' + (j.st === 'AZ' ? ' (one hour earlier on the board for AZ)' : '') + '.');
    }
    if (j.win.sharp || j.win.s === j.win.e) {
      const sd = shopDrive(j);
      if (sd > 30) E('SHARP_LOCAL', j, t, (j.st === 'AZ' ? '8:00 AZ' : '8:00') + ' sharp is for local jobs only. ' + j.city + ' is ' + sd + ' min from the ' + SHOP[j.st].name + '.', 'Use the ' + winText({ s: j.win.s, e: j.win.s + 60 }, j.st) + ' window instead.');
      if (j.start !== j.win.s) E('ARRIVAL', j, t, j.cust + ' was booked ' + winText(j.win, j.st) + ' but the tech arrives ' + clockFull(j.start) + (j.st === 'AZ' ? ' board' : '') + '.', 'Start the block right at ' + clockFull(j.win.s) + '.');
    } else if (j.start < j.win.s || j.start > j.win.e) {
      E('ARRIVAL', j, t, j.cust + '\'s arrival (' + clockFull(j.start) + (j.st === 'AZ' ? ' board' : '') + ') is outside the ' + winBoth(j.win, j.st) + ' window.', 'Slide the block so it starts inside the window.');
    }
    // the customer's promise
    if (j.promise) {
      if (j.day === j.promise.day) {
        if (j.start < j.promise.s || j.start > j.promise.e)
          E('PROMISE', j, t, j.cust + ' was promised ' + winBoth(j.promise, j.st) + '. Now arriving ' + clockFull(j.start) + (j.st === 'AZ' ? ' board' : '') + '.', 'Keep the arrival inside the window the customer was told, or move it to another day.');
      } else if (!j.flex) {
        W('EXTRA_CALL', j, t, j.cust + ' was moved to ' + day.label + ' but this prompt didn\'t ask for it. That\'s an extra customer call.', 'Only move jobs to another day when today truly can\'t hold them.', 5);
      }
    }
    // prompt requirement
    if (j.req) {
      const q = j.req;
      if (j.day !== q.day) E('REQUEST', j, t, j.cust + ' asked for ' + state.days[q.day].label + '. The job is on ' + day.label + '.', 'Move it to ' + state.days[q.day].label + '.');
      else {
        const okS = q.minS == null || j.win.s >= q.minS, okE = q.maxE == null || j.win.e <= q.maxE;
        const okX = !q.exact || sameWin(j.win, q.exact);
        if (!okS || !okE || !okX) E('REQUEST', j, t, j.cust + ' asked for ' + q.text + '. Booked window: ' + winBoth(j.win, j.st) + '.', 'Book a window that matches what the customer asked for' + (j.st === 'AZ' ? ' (AZ is one hour earlier on the board)' : '') + '.');
      }
    }
    // who gets what (warnings)
    if (t.pay === 'fill') {
      if (/^redo/.test(j.svc)) W('PAY', j, t, 'Redo on ' + t.name + ' (fill-first tech).', 'Redos and no-charge work go to a flex tech.');
      else if (j.commercial) W('PAY', j, t, 'Commercial job on ' + t.name + ' (fill-first tech).', 'Commercial and low-ticket work go to a flex tech.');
      else if (j.svc === 'dv') W('PAY', j, t, 'Dryer-vent-only run on ' + t.name + ' (fill-first tech).', 'Dryer-vent runs are flex-tech filler.');
      else if (j.value && j.value < 300 && !/^est/.test(j.svc)) W('PAY', j, t, 'Low-ticket job ($' + j.value + ') on ' + t.name + ' (fill-first tech).', 'Low-ticket work goes to a flex tech.');
    }
    if (j.svc === 'est-com' && t.id !== 'sean' && t.id !== 'isaiah') W('PAY', j, t, 'Commercial estimate on ' + t.name + '.', 'Commercial estimates go to Sean (WA) or Isaiah (AZ).');
  });

  // per tech, per day: timing, drive, shift, hard stop
  const legs = [];
  state.days.forEach((day, di) => {
    TECHS.forEach(t => {
      const list = techDayJobs(state, t.id, di); if (!list.length || GROUP[t.g].noJobs) return;
      const sh = shiftOf(t, day.dow);
      list.forEach((j, i) => {
        if (i === 0) {
          const es = earliestStart(j, t);
          legs.push({ day: di, tech: t.id, from: null, to: j.id, min: shopDrive(j) });
          if (j.start < es) E('FIRST_DRIVE', j, t, t.name + ' leaves the shop at ' + clockFull(sh.s - 30) + '. ' + j.city + ' is ' + shopDrive(j) + ' min away, so the earliest arrival is ' + clockFull(es) + '.', 'Start the first job at ' + clockFull(es) + ' or later, or put a closer job first.');
        } else {
          const p = list[i - 1], d = legDrive(p, j);
          legs.push({ day: di, tech: t.id, from: p.id, to: j.id, min: d });
          if (j.start < p.start + p.len) E('OVERLAP', j, t, j.cust + ' overlaps ' + p.cust + ' on ' + t.name + '\'s row.', 'One job at a time. Slide it later or give it to someone else.');
          else if (j.start < p.start + p.len + d) E('DRIVE_GAP', j, t, 'No room to drive: ' + p.city + ' → ' + j.city + ' is ' + d + ' min, but ' + t.name.split(' ')[0] + ' has ' + (j.start - p.start - p.len) + ' min between jobs.', 'Start ' + j.cust + ' at ' + clockFull(p.start + p.len + d) + ' or later.');
          if (d > 30) W('LONG_DRIVE', j, t, p.city + ' → ' + j.city + ' is a ' + d + ' min drive on ' + t.name + '\'s row.', 'Aim for under 30 minutes between jobs; group nearby jobs back to back.', 2);
        }
        if (j.start + j.len > sh.e) E('SHIFT_END', j, t, t.name + '\'s day runs to ' + clockFull(j.start + j.len) + '. Shift ends ' + clockFull(sh.e) + (GROUP[t.g].st === 'AZ' ? ' board' : '') + '.', 'Move or shorten ' + dur(j.start + j.len - sh.e) + ' of work.');
      });
      const last = list[list.length - 1], home = shopDrive(last);
      legs.push({ day: di, tech: t.id, from: last.id, to: null, min: home });
      if (t.monStop && day.dow === 1 && last.start + last.len + home > t.monStop)
        E('HARD_STOP', last, t, t.name + ' — Monday hard stop. Route ends ' + clockFull(last.start + last.len + home) + ' at shop.', 'Move or shorten ' + dur(last.start + last.len + home - t.monStop) + ' of work.');
      if (home > 45 && !last.inShop) W('FAR_END', last, t, t.name + ' ends the day in ' + last.city + ', ' + home + ' min from the shop.', 'End each tech\'s day near the shop when you can.', 2);
    });
  });
  const driveTotal = legs.reduce((s, l) => s + l.min, 0);
  return { errors, warns, legs, driveTotal };
}

/* ---------------- search: can this job go anywhere on this day? ---------------- */
// Tries every qualified tech, every allowed window matching `want`, start times every 15 min.
// want: {keepPromise: bool, minS, maxE, exact}. Returns {tech, start, win} or null. Leaves the job as it was.
function findSpot(state, job, day, want) {
  want = want || {};
  const save = { day: job.day, tech: job.tech, start: job.start, len: job.len, win: job.win, status: job.status };
  const dayObj = state.days[day];
  const hard = c => c !== 'PAY' && c !== 'LONG_DRIVE' && c !== 'FAR_END' && c !== 'EXTRA_CALL';
  let found = null;
  const techs = TECHS.filter(t => fitProblems(job, t).length === 0 && worksOn(t, dayObj.dow) && !(dayObj.blocks || []).some(b => b.tech === t.id && (b.kind === 'callout' || b.kind === 'off')));
  for (const t of techs) {
    const len = reqLen(job, t).min;
    let wins = windowsFor(t, job.st);
    if (want.keepPromise && job.promise) wins = wins.filter(w => w.s >= job.promise.s && w.e <= job.promise.e && w.s !== w.e).concat(wins.filter(w => w.s === w.e && w.s >= job.promise.s && w.s <= job.promise.e));
    if (want.minS != null) wins = wins.filter(w => w.s >= want.minS);
    if (want.maxE != null) wins = wins.filter(w => w.e <= want.maxE);
    if (want.exact) wins = wins.filter(w => sameWin(w, want.exact));
    for (const w of wins) {
      for (let s = w.s; s <= w.e; s += 15) {
        Object.assign(job, { day, tech: t.id, start: s, len, win: { s: w.s, e: w.e, sharp: !!w.sharp }, status: 'active' });
        const ev = evaluate(Object.assign({}, state, { prompt: null }));
        const bad = ev.errors.some(e => hard(e.code) && (e.job === job.id || (e.tech === t.id && jobDay(state, e.job) === day) || (e.code === 'HARD_STOP' && e.tech === t.id)) && e.code !== 'NOT_CANCELLED' && e.code !== 'REQUEST' && e.code !== 'PROMISE');
        if (!bad) { found = { tech: t.id, start: s, win: { s: w.s, e: w.e, sharp: !!w.sharp } }; break; }
        if (w.s === w.e) break;
      }
      if (found) break;
    }
    if (found) break;
  }
  Object.assign(job, save);
  return found;
}
function jobDay(state, id) { const j = state.jobs.find(x => x.id === id); return j ? j.day : null; }

/* ---------------- seeded RNG ---------------- */
function rng(seed) { let a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const API = {
  WA_CARPET_COLS, WA_CARPET_AREAS, WA_CARPET_OTHER, AZ_CARPET_AREAS, AZ_CARPET_OTHER, DUCT_COLS, SQFT, SQFT_BADGE, WA_DUCT, AZ_DUCT, PIECES, FIXED, SVC,
  GROUPS, GROUP, TECHS, TECH, NO_SCHEDULE, PAY_LABEL, SHOP, MODEL,
  shiftOf, worksOn, setCities, shopDrive, legDrive, modelDrive, reqLen, piecesText, piecesMin,
  clock, clockFull, hrs, dur, winText, winBoth, windowsFor, winAllowed, sameWin,
  fitProblems, shortGroup, evaluate, findSpot, techDayJobs, earliestStart, placed, rng,
  get CITY() { return CITY; }
};
if (typeof module !== 'undefined' && module.exports) module.exports = API; else window.SBG = API;
})();

<script>/* Schedule Board Game: prompts and scoring (pure, no DOM). Needs engine.js loaded first. */
(function () {
'use strict';
const S = (typeof module !== 'undefined' && module.exports) ? require('./engine.js') : window.SBG;

const KINDS = {
  callout: 'Tech call out',
  cancel: 'Cancellation',
  sameday: 'Reschedule, same day new time',
  otherday: 'Reschedule, different day'
};
const FIELD_GROUPS = ['wa-new', 'wa-big', 'wa-dodge', 'wa-cab', 'az-cc', 'az-vm'];

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function pick(R, arr) { return arr[Math.floor(R() * arr.length)]; }
function shuffle(R, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const k = Math.floor(R() * (i + 1)); const t = a[i]; a[i] = a[k]; a[k] = t; } return a; }
function first(name) { return name.split(' ')[0]; }
function local(m, st) { return m + (st === 'AZ' ? 60 : 0); }
function board(m, st) { return m - (st === 'AZ' ? 60 : 0); }
function svcText(j) { const s = S.SVC[j.svc]; if (j.svc === 'carpet') return j.areas + '-area carpet'; if (j.svc === 'duct') return (j.tier === 'D' ? 'Diamond' : 'Essential') + ' duct cleaning'; return s.label.toLowerCase(); }
function placedOn(state, day) { return state.jobs.filter(j => S.placed(j) && j.day === day); }
function warnKey(w) { return w.code + '|' + w.job + '|' + w.tech; }

// Build a fresh playable state from a scenario in the bundle.
function startState(scn) {
  const st = clone(scn);
  st.jobs.forEach(j => { j.status = 'active'; j.promise = { day: j.day, s: j.win.s, e: j.win.e }; j.flex = false; j.req = null; j.mustCancel = false; });
  st.prompt = null;
  return st;
}

/* ---------- prompt makers: each returns ctx or null when the board can't support it ---------- */
function mkCallout(state, R) {
  const counts = {};
  placedOn(state, 0).forEach(j => { counts[j.tech] = (counts[j.tech] || 0) + 1; });
  const cands = shuffle(R, S.TECHS.filter(t => FIELD_GROUPS.indexOf(t.g) !== -1 && (counts[t.id] || 0) >= 2 && !(state.days[0].blocks || []).some(b => b.tech === t.id && (b.kind === 'callout' || b.kind === 'off'))));
  for (const t of cands) {
    const jobs = S.techDayJobs(state, t.id, 0);
    // at least one job must be re-homeable today, or the prompt teaches nothing
    const sh = S.shiftOf(t);
    const trial = clone(state);
    trial.days[0].blocks.push({ tech: t.id, s: sh.s, e: sh.e, label: 'Call out', kind: 'callout' });
    const tj = trial.jobs.filter(j => jobs.some(x => x.id === j.id));
    tj.forEach(j => { j.tech = null; });
    // every job must have a home (today, or one of the next two days), and at least one must fit today
    let today = 0, ok = true;
    for (const j of tj) {
      let sp = S.findSpot(trial, j, 0, { keepPromise: true }), d = 0;
      if (sp) today++; else { for (d of [1, 2]) { sp = trial.days[d] && S.findSpot(trial, j, d, {}); if (sp) break; } }
      if (!sp) { ok = false; break; }
      Object.assign(j, { day: d, tech: sp.tech, start: sp.start, win: sp.win, len: S.reqLen(j, S.TECH[sp.tech]).min });
    }
    if (!ok || !today) continue;
    state.days[0].blocks.push({ tech: t.id, s: sh.s, e: sh.e, label: 'Call out', kind: 'callout' });
    jobs.forEach(j => { j.tech = null; j.flex = true; j.prompt = true; });
    return {
      kind: 'callout', tech: t.id, jobs: jobs.map(j => j.id),
      title: first(t.name) + ' called out',
      who: 'Office note, 6:45 AM',
      quote: t.name + ' called out sick for ' + state.days[0].label + '.',
      task: jobs.length + ' jobs from ' + first(t.name) + '\'s row are waiting in "Needs a tech." Give each one to a qualified tech today and keep the window the customer was promised. If today truly can\'t hold a job, move it to another day (that one becomes a call to the customer).'
    };
  }
  return null;
}

function mkCancel(state, R) {
  const cands = shuffle(R, placedOn(state, 0).filter(j => j.svc !== 'rug-shop' && !/^est/.test(j.svc)));
  for (const j of cands) {
    // a later-day job that could fill the gap
    j.status = 'cancelled';
    let pull = null;
    const later = shuffle(R, state.jobs.filter(x => S.placed(x) && x.day > 0 && x.st === j.st && x.svc !== 'rug-shop' && S.SVC[x.svc].kind === S.SVC[j.svc].kind));
    for (const x of later.slice(0, 12)) { const spot = S.findSpot(state, x, 0, {}); if (spot) { pull = x; break; } }
    j.status = 'active';
    if (!pull) continue;
    j.mustCancel = true; j.prompt = true;
    pull.flex = true; pull.pullForward = true; pull.prompt = true;
    const t = S.TECH[j.tech];
    return {
      kind: 'cancel', job: j.id, pull: pull.id,
      title: j.cust + ' cancelled',
      who: j.cust + ' · ' + j.city,
      quote: pick(R, ['Hi, it\'s ' + first(j.cust) + '. We have to cancel today, sorry. We\'ll call back to rebook.', 'This is ' + first(j.cust) + '. Something came up at work and nobody will be home today. Please cancel.', 'Hi, ' + first(j.cust) + ' here. We need to cancel today\'s appointment.']),
      task: 'Cancel ' + first(j.cust) + '\'s ' + svcText(j) + ' (' + t.name + ', ' + S.winBoth(j.win, j.st) + '). Then use the gap: tighten the routes, or pull ' + pull.cust + ' (' + pull.city + ', ' + svcText(pull) + ', booked ' + state.days[pull.day].label + ') into today. They asked for a call if anything opens up sooner.'
    };
  }
  return null;
}

const SAMEDAY_ASKS = [
  { text: 'anytime after 12', minL: 720, quote: f => 'Hi, this is ' + f + '. Something came up this morning. Can you come after lunch instead? Anytime after 12 works.' },
  { text: 'anytime after 1', minL: 780, quote: f => 'It\'s ' + f + '. I can\'t get home until 1. Can the tech come after that?' },
  { text: 'morning, done by 12', maxL: 720, quote: f => 'Hi, ' + f + ' here. I have to leave at noon. Any chance you can come in the morning instead?' },
  { text: 'between 10 and 12', exactL: [600, 720], quote: f => 'This is ' + f + '. Could the tech come between 10 and 12 instead?' },
  { text: 'between 1 and 3', exactL: [780, 900], quote: f => 'Hi, it\'s ' + f + '. Is a 1 to 3 window open today? That works way better for me.' },
  { text: 'between 9 and 11', exactL: [540, 660], quote: f => 'It\'s ' + f + '. Could you do 9 to 11 instead?' }
];
function askWant(a, st) {
  const w = {};
  if (a.minL != null) w.minS = board(a.minL, st);
  if (a.maxL != null) w.maxE = board(a.maxL, st);
  if (a.exactL) w.exact = { s: board(a.exactL[0], st), e: board(a.exactL[1], st) };
  return w;
}
function satisfies(win, w) {
  if (w.minS != null && win.s < w.minS) return false;
  if (w.maxE != null && win.e > w.maxE) return false;
  if (w.exact && !S.sameWin(win, w.exact)) return false;
  return true;
}
function mkSameday(state, R) {
  const cands = shuffle(R, placedOn(state, 0).filter(j => j.svc !== 'rug-shop' && j.tech !== 'sean'));
  for (const j of cands) {
    for (const a of shuffle(R, SAMEDAY_ASKS)) {
      const want = askWant(a, j.st);
      if (satisfies(j.win, want)) continue;
      const keep = j.promise; j.promise = null;
      const spot = S.findSpot(state, j, 0, want);
      j.promise = keep;
      if (!spot) continue;
      j.req = Object.assign({ kind: 'sameday', day: 0, text: a.text + (j.st === 'AZ' ? ' Arizona time' : '') }, want);
      j.promise = null; j.flex = true; j.prompt = true;
      return {
        kind: 'sameday', job: j.id, title: j.cust + ' wants a new time today',
        who: j.cust + ' · ' + j.city + (j.st === 'AZ' ? ' (Arizona)' : ''),
        quote: a.quote(first(j.cust)),
        task: 'Move ' + first(j.cust) + '\'s ' + svcText(j) + ' (now ' + S.winBoth(j.win, j.st) + ' on ' + S.TECH[j.tech].name + ') to a window today that matches what they asked for' + (j.st === 'AZ' ? '. Arizona is one hour ahead of the board in winter: book it one hour early.' : ', without breaking anyone else\'s day.')
      };
    }
  }
  return null;
}

const OTHERDAY_ASKS = [
  { text: 'any time', quote: (f, d) => 'Hey, it\'s ' + f + '. Any chance we can move to ' + d + '? Any time that day works.' },
  { text: 'the morning (done by 12)', maxL: 720, quote: (f, d) => 'This is ' + f + '. Can we push to ' + d + ' morning instead?' },
  { text: 'the afternoon (after 12)', minL: 720, quote: (f, d) => 'Hi, ' + f + ' here. Could we do ' + d + ' afternoon instead of today?' }
];
function mkOtherday(state, R) {
  const cands = shuffle(R, placedOn(state, 0).filter(j => j.svc !== 'rug-shop' && j.tech !== 'sean'));
  for (const j of cands) {
    for (const d of shuffle(R, [1, 2])) {
      if (!state.days[d]) continue;
      for (const a of shuffle(R, OTHERDAY_ASKS)) {
        const want = askWant(a, j.st);
        const keep = j.promise; j.promise = null;
        const spot = S.findSpot(state, j, d, want);
        j.promise = keep;
        if (!spot) continue;
        const dl = state.days[d].label.split(',')[0];
        j.req = Object.assign({ kind: 'otherday', day: d, text: state.days[d].label + ', ' + a.text + (j.st === 'AZ' && a.text !== 'any time' ? ' Arizona time' : '') }, want);
        j.promise = null; j.flex = true; j.prompt = true;
        const dayName = { Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday', Sat: 'Saturday' }[dl] || dl;
        return {
          kind: 'otherday', job: j.id, day: d, title: j.cust + ' wants another day',
          who: j.cust + ' · ' + j.city + (j.st === 'AZ' ? ' (Arizona)' : ''),
          quote: a.quote(first(j.cust), dayName),
          task: 'Move ' + first(j.cust) + '\'s ' + svcText(j) + ' to ' + state.days[d].label + ' (' + a.text + '). Use the › arrow at the top to open that day\'s board, then fit it in with a qualified tech.'
        };
      }
    }
  }
  return null;
}
const MAKERS = { callout: mkCallout, cancel: mkCancel, sameday: mkSameday, otherday: mkOtherday };

// Applies a prompt to the state. kind optional; picks a workable one at random.
function makePrompt(state, R, kind, avoid) {
  const order = kind ? [kind] : shuffle(R, Object.keys(MAKERS).filter(k => k !== avoid)).concat(avoid ? [avoid] : []);
  for (const k of order) {
    const before = S.evaluate(state);
    const ctx = MAKERS[k](state, R);
    if (!ctx) continue;
    ctx.label = KINDS[k];
    ctx.errorsSeen = 0; ctx.submits = 0;
    ctx.startWarns = before.warns.map(warnKey);
    // baseline drive after the forced part of the change
    if (k === 'cancel') { const j = state.jobs.find(x => x.id === ctx.job); j.status = 'cancelled'; ctx.baseDrive = S.evaluate(state).driveTotal; j.status = 'active'; }
    else ctx.baseDrive = before.driveTotal;
    state.prompt = ctx;
    return ctx;
  }
  return null;
}

// Submit: returns {pass, errors, warns, score?}
function submit(state) {
  const ctx = state.prompt, ev = S.evaluate(state);
  ctx.submits++;
  if (ev.errors.length) { ctx.errorsSeen += ev.errors.length; return { pass: false, errors: ev.errors, warns: ev.warns }; }
  const lines = [];
  let score = 100;
  const errPen = Math.min(50, ctx.errorsSeen * 5);
  if (errPen) lines.push({ t: ctx.errorsSeen + ' error' + (ctx.errorsSeen === 1 ? '' : 's') + ' fixed before passing', p: -errPen });
  const newWarns = ev.warns.filter(w => ctx.startWarns.indexOf(warnKey(w)) === -1);
  const warnPen = Math.min(30, newWarns.reduce((s, w) => s + w.pts, 0));
  if (warnPen) lines.push({ t: newWarns.length + ' warning' + (newWarns.length === 1 ? '' : 's') + ' (who gets what, long drives)', p: -warnPen });
  score -= errPen + warnPen;
  if (ctx.kind === 'callout') {
    let pushed = 0, avoidable = 0;
    ctx.jobs.forEach(id => {
      const j = state.jobs.find(x => x.id === id);
      if (j.day !== 0) { pushed++; if (S.findSpot(state, j, 0, { keepPromise: true })) avoidable++; }
    });
    if (avoidable) { score -= avoidable * 10; lines.push({ t: avoidable + ' job' + (avoidable === 1 ? '' : 's') + ' pushed to another day that could have stayed today', p: -avoidable * 10 }); }
    if (!pushed) { score += 5; lines.push({ t: 'Every job stayed on the same day', p: 5 }); }
  } else {
    const saved = ctx.baseDrive - ev.driveTotal;
    const b = Math.max(0, Math.min(10, Math.floor(saved / 5)));
    if (b) { score += b; lines.push({ t: saved + ' fewer drive minutes', p: b }); }
  }
  if (ctx.kind === 'cancel') { const p = state.jobs.find(x => x.id === ctx.pull); if (p.day === 0) { score += 5; lines.push({ t: 'Pulled ' + p.cust + ' into the opening', p: 5 }); } }
  if (ctx.submits === 1) lines.unshift({ t: 'Passed on the first submit', p: 0 });
  score = Math.max(0, Math.min(115, score));
  ctx.score = score; ctx.lines = lines; ctx.newWarns = newWarns;
  return { pass: true, errors: [], warns: ev.warns, newWarns, score, lines };
}

// After a pass: the board as it stands becomes the new promise for the next prompt.
function settle(state) {
  state.jobs.forEach(j => {
    if (j.status !== 'active' || j.day == null) return;
    j.promise = { day: j.day, s: j.win.s, e: j.win.e };
    j.flex = false; j.req = null; j.prompt = false; j.pullForward = false;
  });
  state.prompt = null;
}

const API = { KINDS, startState, makePrompt, submit, settle, svcText, clone };
if (typeof module !== 'undefined' && module.exports) module.exports = API; else window.SBGPlay = API;
})();
</script>
<script>/* Schedule Board Game: page UI. Needs engine.js (window.SBG) and play.js (window.SBGPlay). */
(function () {
'use strict';
const S = window.SBG, P = window.SBGPlay;
const B = JSON.parse(document.getElementById('bundle').textContent);
S.setCities(B.cities);
const T0 = 420, T1 = 1080;     // board runs 7 AM to 6 PM
const CCRS = ['Alyssa R.', 'Angel A.', 'Brice M.', 'Brooke M.', 'JeriLynn D.', 'Kendall O.', 'Nate S.', 'Sam M.'];
const KEY = 'sbg.huddle.v1';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
const first = n => n.split(' ')[0];
const snap = (m, step) => Math.round(m / (step || 15)) * (step || 15);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const small = () => window.innerWidth < 700;

const G = {
  phase: 'start', players: [], turn: 0, round: 1, scores: {}, opts: { timer: false, help: false }, used: [],
  state: null, snap: null, promptNo: 0, lastKind: null, viewDay: 0, sel: null, errs: {}, errList: [], collapsed: {},
  px: 1.4, t0: 0, result: null, modal: null, rulesTab: 'rules', placing: false, sheetOpen: true, promptOpen: true
};
const saved = store.get(KEY, null);

/* ---------------- helpers on the game state ---------------- */
const J = id => G.state.jobs.find(j => j.id === id);
const day = () => G.state.days[G.viewDay];
function pxPerMin() {
  const nameW = small() ? 118 : 180;
  const fit = (window.innerWidth - nameW - 8) / (T1 - T0);
  return Math.max(small() ? 1.1 : 1.0, Math.min(3, fit * G.px / 1.4));
}
function initials(n) { return n.replace('*', '').split(' ').map(x => x[0]).join('').slice(0, 2).toUpperCase(); }
function techSub(t) {
  const g = S.GROUP[t.g];
  if (g.noJobs) return 'Leadership · no jobs';
  const sh = S.shiftOf(t), d = day();
  if (!S.worksOn(t, d.dow)) return 'Off today';
  if ((d.blocks || []).some(b => b.tech === t.id && b.kind === 'callout')) return 'Called out';
  const pay = t.pay ? ' · ' + S.PAY_LABEL[t.pay] : '';
  return S.clock(sh.s, false).replace(' ', '') + '–' + S.clock(sh.e).replace(' ', '').toLowerCase() + (g.st === 'AZ' ? ' board' : '') + pay;
}

/* ---------------- badges ---------------- */
function badges(j) {
  const b = [];
  if (j.svc === 'carpet') b.push('<b class="bd cy">' + j.areas + '</b>');
  else if (j.svc === 'duct') { b.push('<b class="bd pk">' + S.SQFT_BADGE[j.sq] + '</b>'); b.push(j.tier === 'D' ? '<b class="bd dm">💎 Diamond</b>' : '<b class="bd tg">Essential</b>'); }
  else if (j.svc === 'dv') b.push('<b class="bd tg">DV' + (j.st === 'WA' ? (j.dvLong ? ' 10ft+' : ' &lt;10ft') : '') + '</b>');
  else if (j.svc === 'furn') b.push('<b class="bd cy">🛋 ' + Object.values(j.pieces || {}).reduce((a, c) => a + c, 0) + '</b>');
  else if (j.svc === 'tile') b.push('<b class="bd cy">Tile</b>');
  else if (j.svc === 'rug-home') b.push('<b class="bd cy">Rug</b>');
  else if (j.svc === 'hardwood') b.push('<b class="bd cy">Wood</b>');
  else if (j.svc === 'rug-shop') b.push('<b class="bd pk">Rug drop</b>');
  (j.tags || []).forEach(t => b.push('<b class="bd ' + (t === 'GS' ? 'gs' : t === 'Redo' || t === 'Est' ? 'ye' : 'tg') + '">' + esc(t) + '</b>'));
  if (j.water) b.push('<b class="bd wt">WATER</b>');
  if (j.portable) b.push('<b class="bd pt">PORTABLE</b>');
  if (j.commercial) b.push('<b class="bd cm">COMM</b>');
  b.push(j.st === 'AZ' ? '<b class="bd azs">AZ</b>' : '<b class="bd wa">WA</b>');
  return b.join('');
}

/* ---------------- top + prompt ---------------- */
function topHTML() {
  const d = day();
  return '<div class="top">' +
    '<button class="btn hide-s" data-act="today">Today</button>' +
    '<div class="date"><span class="cal">📅 </span>' + esc(d.label) + (G.viewDay ? '' : ' <span class="hide-s" style="color:var(--ink2);font-weight:400">(today)</span>') + '</div>' +
    '<button class="btn arrow" data-act="prev" aria-label="Previous day"' + (G.viewDay === 0 ? ' disabled' : '') + '>‹</button>' +
    '<button class="btn arrow" data-act="next" aria-label="Next day"' + (G.viewDay === G.state.days.length - 1 ? ' disabled' : '') + '>›</button>' +
    '<span class="sp"></span><span class="internal hide-s">Internal — Alpine Specialty Services</span>' +
    '<button class="btn hide-s" data-act="zoomout" aria-label="Zoom out">−</button><button class="btn hide-s" data-act="zoomin" aria-label="Zoom in">+</button>' +
    '<button class="btn" data-act="rules">Rules</button><button class="btn" data-act="scores">Scores</button></div>';
}
function promptHTML() {
  const c = G.state.prompt; if (!c) return '';
  const who = G.players[G.turn] || 'Practice';
  let h = '<div class="prompt"><div class="pbody">' +
    '<div class="ptag"><b>' + esc(c.label) + '</b><span>' + esc(who) + ' · prompt ' + G.promptNo + ' of 2</span>' +
    (c.submits ? '<span>· ' + c.submits + ' submit' + (c.submits === 1 ? '' : 's') + '</span>' : '') +
    ' <button class="collapse" data-act="ptoggle">' + (G.promptOpen ? 'Hide' : 'Show') + '</button></div>' +
    '<div class="ptitle">' + esc(c.title) + '</div>';
  if (G.promptOpen) {
    h += '<div class="quote">“' + esc(c.quote) + '”<div class="who2">— ' + esc(c.who) + '</div></div><div class="task">' + esc(c.task) + '</div>';
    if (c.kind === 'cancel') {
      const j = J(c.job);
      h += '<div class="note">' + (j.status === 'cancelled' ? '✓ ' + esc(j.cust) + ' is cancelled. <button class="collapse" data-act="uncancel">Undo</button>' : 'Tap ' + esc(j.cust) + '\'s block (dashed orange) and choose Cancel job.') + '</div>';
    }
  }
  if (G.errList.length) {
    h += '<div class="errs"><h4>' + G.errList.length + ' thing' + (G.errList.length === 1 ? '' : 's') + ' to fix before this counts</h4><ol>' +
      G.errList.map((e, i) => { const j = e.job ? J(e.job) : null; const dl = j && j.day != null && j.day !== G.viewDay ? ' (' + G.state.days[j.day].label + ')' : ''; return '<li data-err="' + i + '">' + esc(e.text) + esc(dl) + '<small>Fix: ' + esc(e.fix) + '</small></li>'; }).join('') + '</ol></div>';
  }
  if (G.phase === 'review') return h + '</div><div class="pact"><button class="btn pri" data-act="backresult">Back to the score</button></div></div>';
  h += '</div><div class="pact"><button class="btn ok" data-act="submit">Submit</button>' +
    '<button class="btn" data-act="restart">Start this prompt over</button>' +
    (G.opts.timer ? '<div class="timer" id="timer"></div>' : '') + '</div></div>';
  return h;
}
function trayHTML() {
  const list = G.state.jobs.filter(j => j.status === 'active' && j.tech == null);
  if (!list.length) return '';
  return '<div class="tray"><span class="lbl">Needs a tech (' + list.length + ')</span>' + list.map(j =>
    '<div class="job' + (G.sel === j.id ? ' sel' : '') + (G.errs[j.id] ? ' err' : '') + '" data-job="' + j.id + '" style="position:relative;flex:none;max-width:320px">' + badges(j) + '<span class="nm">' + esc(j.cust) + ' - ' + esc(j.city) + '</span></div>').join('') +
    '<span class="note" style="white-space:nowrap">' + (G.sel && !J(G.sel).tech ? 'Now tap a spot on a tech\'s row.' : 'Tap a job, then tap a spot on a tech\'s row.') + '</span></div>';
}

/* ---------------- the board ---------------- */
function boardHTML() {
  const px = pxPerMin(), W = (T1 - T0) * px, d = day(), di = G.viewDay;
  const selJob = G.sel ? J(G.sel) : null;
  let h = '<div class="grid" style="width:calc(var(--name) + ' + Math.ceil(W) + 'px)"><div class="thead"><div class="corner"></div><div class="ticks" style="width:' + W + 'px">';

/* ---------------- edits ---------------- */
function moveJob(j, techId, d, start) {
  const t = S.TECH[techId], old = j.tech;

    else if (r.min !== j.len) toast('Timing needs to be adjusted for this block based on ' + first(t.name) + '\'s skill and timing.');
    else if (t.seanWin && !S.winAllowed(j.win, t, j.st)) toast('Sean\'s window has to be 8–12 or 12–4.');
  }
}
function fitIn(j, w) {
  const t = S.TECH[j.tech]; if (!t) return null;
  const others = S.techDayJobs(G.state, j.tech, j.day).filter(x => x.id !== j.id);
  const es = S.earliestStart(j, t), sh = S.shiftOf(t);
  const lo = w.s === w.e ? w.s : Math.max(w.s, es), hi = w.s === w.e ? w.s : w.e;
  for (let s = Math.ceil(lo / 5) * 5; s <= hi; s += 5) {
    const before = others.filter(o => o.start <= s).pop(), after = others.find(o => o.start > s);
    let ok = before ? s >= before.start + before.len + S.legDrive(before, j) : s >= es;
    if (ok && after) ok = s + j.len + S.legDrive(j, after) <= after.start;
    if (ok && s + j.len > sh.e) ok = false;
    if (ok) return s;
  }
  return null;
}
function earliestFit(j) { return fitIn(j, j.win); }
// Earliest legal start on this row in any window the customer would accept (their request, or the window they were promised).
function bestFit(j) {
  const t = S.TECH[j.tech]; if (!t) return null;
  let wins = S.windowsFor(t, j.st);
  if (j.req && j.req.day === j.day) wins = wins.filter(w => (j.req.minS == null || w.s >= j.req.minS) && (j.req.maxE == null || w.e <= j.req.maxE) && (!j.req.exact || S.sameWin(w, j.req.exact)));
  else if (j.promise && j.promise.day === j.day) wins = wins.filter(w => w.s >= j.promise.s && w.e <= j.promise.e && (w.s !== w.e || w.s <= j.promise.e));
  wins = [j.win].filter(w => wins.some(x => S.sameWin(x, w))).concat(wins.filter(w => !S.sameWin(w, j.win)));
  let best = null;
  wins.forEach(w => { const s = fitIn(j, w); if (s != null && (!best || s < best.s)) best = { s, w }; });
  return best;
}

    const m = snap(T0 + (d.left0 + (e.clientX - d.x0)) / px);

    void r;
  }
  G.sel = j.id; G.sheetOpen = true; render(); swallowClick();
});
document.addEventListener('pointercancel', () => { if (dragState) { dragState = null; render(); } });
function swallowClick() { const f = ev => { ev.stopPropagation(); ev.preventDefault(); }; document.addEventListener('click', f, { capture: true, once: true }); setTimeout(() => document.removeEventListener('click', f, { capture: true }), 50); }
document.addEventListener('change', e => {
  if (e.target.id === 'optTimer') G.opts.timer = e.target.checked;
  if (e.target.id === 'optHelp') G.opts.help = e.target.checked;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (G.modal) G.modal = null; else G.sel = null; render(); } });
window.addEventListener('resize', () => { if (G.state) render(); });

if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) window.__G = G;
render();
})();
