<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-title" content="Dispatch Drill"><meta name="apple-mobile-web-app-capable" content="yes"><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Alpine Dispatch Drill</title>
<meta name="theme-color" content="#0A5B64">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#EDF2F1; --surface:#FFFFFF; --surface-2:#F4F8F7; --line:#D3DEDC; --line-2:#E3EBEA;
  --ink:#0F2428; --ink-2:#3B5357; --muted:#657C80;
  --accent:#0A5B64; --accent-ink:#FFFFFF; --accent-soft:#D5EAEA;
  --window:#C08416; --bad:#BD3829; --bad-soft:#F7DDD8; --good:#1F7F55; --good-soft:#D6EEE1;
  --block:#8C9C9E; --pin-ink:#FFFFFF; --shadow:0 -8px 30px rgba(15,36,40,.16);
  --t0:#2F6FD0; --t1:#D2691E; --t2:#23875A; --t3:#B03F78; --t4:#7152C4; --t5:#977708; --t6:#12909C;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --lab:108px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A1416; --surface:#111F22; --surface-2:#16282B; --line:#283C3F; --line-2:#1C2F32;
    --ink:#E2EDED; --ink-2:#B3C6C8; --muted:#86A2A5;
    --accent:#5BBEC7; --accent-ink:#052528; --accent-soft:#163A3E;
    --window:#E3AA3E; --bad:#F07262; --bad-soft:#3A1D19; --good:#58C68C; --good-soft:#15342A;
    --block:#6E8487; --pin-ink:#06171A; --shadow:0 -8px 30px rgba(0,0,0,.55);
    --t0:#72A4F2; --t1:#F0934C; --t2:#52C08B; --t3:#E57DB1; --t4:#A68EF2; --t5:#D8B53E; --t6:#4FC7D2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0A1416; --surface:#111F22; --surface-2:#16282B; --line:#283C3F; --line-2:#1C2F32;
  --ink:#E2EDED; --ink-2:#B3C6C8; --muted:#86A2A5;
  --accent:#5BBEC7; --accent-ink:#052528; --accent-soft:#163A3E;
  --window:#E3AA3E; --bad:#F07262; --bad-soft:#3A1D19; --good:#58C68C; --good-soft:#15342A;
  --block:#6E8487; --pin-ink:#06171A; --shadow:0 -8px 30px rgba(0,0,0,.55);
  --t0:#72A4F2; --t1:#F0934C; --t2:#52C08B; --t3:#E57DB1; --t4:#A68EF2; --t5:#D8B53E; --t6:#4FC7D2;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text]{height:44px;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 12px;font:500 15px var(--f-body)}
.eyebrow{font:600 11px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.linkbtn{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* ---------- home ---------- */
.home{max-width:600px;margin:0 auto;padding:30px 18px 60px;display:flex;flex-direction:column;gap:30px}
.wordmark{font:700 68px/.84 var(--f-display);text-transform:uppercase;letter-spacing:-.005em;margin:12px 0 0}
.wordmark span{display:block;color:var(--accent)}
.lede{margin:14px 0 0;color:var(--ink-2);font-size:16.5px;max-width:44ch}
.field{display:grid;gap:6px}
.field label{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;gap:12px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:100%}
.card:hover{border-color:var(--accent)}
.shield{width:44px;height:50px;display:grid;place-items:center;padding-bottom:8px;font:700 18px/1 var(--f-display);letter-spacing:.02em;color:var(--accent-ink);background:var(--accent);clip-path:polygon(8% 0,92% 0,100% 16%,100% 60%,50% 100%,0 60%,0 16%)}
.shield.az{background:var(--window);color:#1B1403}
.cbody{display:grid;gap:2px;min-width:0}
.cbody h3{margin:0;font:700 23px/1.05 var(--f-display);letter-spacing:.01em}
.cbody .date{color:var(--ink-2);font-size:14.5px}
.meta{font:500 10.5px/1.5 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.best{text-align:right;font:700 30px/1 var(--f-display)}
.best small{display:block;font:500 9.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.rules h2{font:700 22px var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.rule{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.rule > b{font:700 34px/1 var(--f-display)}
.rule h4{margin:0;font:600 16px var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.rule p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.rule.zero > b{color:var(--bad)}
.foot{font-size:12.5px;color:var(--muted);margin:0;max-width:60ch}

/* ---------- game shell ---------- */
.game{display:flex;flex-direction:column;height:100vh;height:100dvh}
.gbar{flex:none;background:var(--surface);border-bottom:1px solid var(--line)}
.gtop{display:flex;align-items:center;gap:10px;padding:10px 12px 8px}
.iconbtn{width:38px;height:38px;flex:none;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font:600 18px var(--f-body)}
.gtitle{min-width:0;flex:1}
.gtitle h2{margin:0;font:700 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtitle div{font:500 10.5px var(--f-mono);color:var(--muted);letter-spacing:.05em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reads{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto}
.read{flex:none;display:flex;align-items:baseline;gap:7px;padding:5px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2)}
.read span{font:600 10px var(--f-mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.read b{font:700 17px/1 var(--f-display)}
.read.alert{background:var(--bad-soft);border-color:transparent}
.read.alert b,.read.alert span{color:var(--bad)}
.tabs{display:flex;padding:0 4px}
.tab{flex:1;text-align:center;padding:9px 2px 8px;font:600 14.5px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2.5px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tab i{font-style:normal;display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font:600 10px var(--f-mono);margin-left:4px;padding:0 4px;vertical-align:1px}
.gmain{flex:1;min-height:0;overflow:auto;position:relative;overscroll-behavior:contain}
.dock{flex:none;display:flex;gap:10px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.btn{height:46px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font:600 15px var(--f-display);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.btn.primary{flex:1;height:50px;background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:19px;letter-spacing:.07em}
.btn[data-armed="1"]{border-color:var(--bad);color:var(--bad)}

/* ---------- board ---------- */
.tray{position:sticky;left:12px;max-width:calc(100vw - 24px);margin:10px 12px 0;padding:10px;border:1.5px dashed var(--bad);border-radius:12px;background:var(--bad-soft)}
.tray-h{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--bad);margin-bottom:8px}
.tray-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.jchip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:150px;display:grid;gap:2px}
.jchip b{font-weight:600;font-size:13.5px}
.jchip span{font-size:12px;color:var(--ink-2)}
.new{font:600 9.5px var(--f-mono);font-style:normal;color:var(--accent-ink);background:var(--accent);padding:1px 4px;border-radius:3px;margin-left:4px;vertical-align:1px}
.grid{position:relative;margin-top:10px}
.ruler{position:sticky;top:0;z-index:6;display:flex;height:26px;background:var(--surface);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.corner{position:sticky;left:0;z-index:7;flex:none;width:var(--lab);background:var(--surface);border-right:1px solid var(--line);font:600 10px var(--f-mono);color:var(--muted);display:flex;align-items:center;padding-left:12px;letter-spacing:.1em}
.ticks{position:relative;flex:none}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font:500 10px var(--f-mono);color:var(--muted);padding:6px 0 0 4px;white-space:nowrap}
.row{display:flex;height:84px;border-bottom:1px solid var(--line)}
.who{position:sticky;left:0;z-index:5;flex:none;width:var(--lab);background:var(--surface);border-right:1px solid var(--line);border-left:4px solid var(--tc);padding:8px 6px 6px 9px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.who b{font:700 17px/1 var(--f-display);letter-spacing:.02em}
.who small{font:500 9.5px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.eq{display:flex;gap:3px;flex-wrap:wrap}
.eqc{font:600 8.5px/1 var(--f-mono);padding:2px 4px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);letter-spacing:.03em}
.eqc.hot{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.lane{position:relative;flex:none;background-color:var(--surface-2);background-image:linear-gradient(90deg,var(--line-2) 1px,transparent 1px);overflow:hidden}
.job{position:absolute;top:8px;height:46px;border-radius:7px;background:color-mix(in oklab,var(--tc) 15%,var(--surface));border:1px solid color-mix(in oklab,var(--tc) 45%,transparent);border-left:4px solid var(--tc);padding:4px 6px 0 6px;overflow:hidden;font-size:12px;line-height:1.25;z-index:2;display:block}
.job.helper{border-style:dashed;background:color-mix(in oklab,var(--tc) 6%,var(--surface))}
.job.lost{border-color:var(--bad);border-left-color:var(--bad);background:var(--bad-soft)}
.job.sel{box-shadow:0 0 0 2px var(--ink);z-index:4}
.job .c{display:flex;gap:5px;align-items:baseline;font-weight:600;white-space:nowrap;overflow:hidden;padding-right:2px}
.jid{font:600 10px var(--f-mono);color:var(--muted)}
.job .s{display:block;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flags{position:absolute;right:3px;bottom:3px;display:flex;gap:2px}
.flg{font:600 8.5px/1 var(--f-mono);padding:2px 3px;border-radius:3px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.flg.hot{border-color:var(--bad);color:#fff;background:var(--bad)}
.real{position:absolute;top:59px;height:6px;border-radius:3px;background:color-mix(in oklab,var(--tc) 65%,transparent);z-index:1}
.over{position:absolute;top:59px;height:6px;border-radius:0 3px 3px 0;background:repeating-linear-gradient(135deg,var(--bad) 0 3px,transparent 3px 6px);z-index:1}
.drv{position:absolute;top:56px;font:500 9.5px var(--f-mono);color:var(--muted);transform:translateX(-100%);padding-right:4px;white-space:nowrap}
.win{position:absolute;top:73px;height:3px;border-radius:2px;background:var(--window);opacity:.85}
.blk{position:absolute;top:5px;bottom:5px;border-radius:7px;border:1px dashed var(--block);background:repeating-linear-gradient(135deg,color-mix(in oklab,var(--block) 22%,transparent) 0 5px,transparent 5px 10px);font:500 9.5px/1.25 var(--f-mono);color:var(--muted);padding:4px 5px;overflow:hidden;z-index:1;pointer-events:none}
.blk.callout{border-color:var(--bad);color:var(--bad);font-weight:600;background:repeating-linear-gradient(135deg,color-mix(in oklab,var(--bad) 13%,transparent) 0 5px,transparent 5px 10px);z-index:3;display:flex;justify-content:flex-end}
.stop{position:absolute;top:0;bottom:0;border-left:2px solid var(--bad);z-index:3;pointer-events:none}
.stop span{position:absolute;top:3px;left:4px;font:600 8.5px var(--f-mono);color:var(--bad);white-space:nowrap;letter-spacing:.05em}
.key{position:sticky;left:0;max-width:100vw;padding:12px 14px 20px;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--ink-2)}
.key span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:6px;border-radius:3px}

/* ---------- map ---------- */
.mapwrap{padding:12px 12px 24px;max-width:600px;margin:0 auto}
.map{display:block;width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.m-ring{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 4}
.m-ringl{font:500 9px var(--f-mono);fill:var(--muted)}
.m-city{font:500 10px var(--f-body);fill:var(--muted)}
.m-cdot{fill:var(--muted)}
.m-route{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
.m-route.help{stroke-dasharray:4 4;opacity:.6}
.m-pin{cursor:pointer}
.m-pin circle{stroke:var(--surface);stroke-width:2}
.m-pin text{font:600 9px var(--f-mono);fill:var(--pin-ink);pointer-events:none}
.m-pin.un circle{fill:var(--surface);stroke:var(--bad);stroke-width:2.5}
.m-pin.un text{fill:var(--bad)}
.m-shop{fill:var(--ink)}
.m-shopl{font:600 10px var(--f-mono);fill:var(--ink)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin-top:10px}
.lg{display:flex;gap:9px;align-items:center;font-size:13px;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:7px 10px}
.lg b{font:700 15px var(--f-display)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--tc);flex:none}

/* ---------- prompts / chart ---------- */
.stack{padding:12px 12px 28px;max-width:680px;margin:0 auto;display:grid;gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.pcard.done{opacity:.62}
.pfrom{font:500 10.5px var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.pcard h3{font:700 22px/1.08 var(--f-display);margin:6px 0 6px}
.pcard p{margin:0 0 12px;color:var(--ink-2)}
.prow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pjob{font:600 12px var(--f-mono);padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.check{margin-left:auto;font:600 13px var(--f-display);text-transform:uppercase;letter-spacing:.05em;padding:7px 11px;border-radius:8px;border:1px solid var(--line)}
.check[aria-pressed="true"]{background:var(--good-soft);color:var(--good);border-color:transparent}
.intro{background:var(--accent-soft);border-radius:14px;padding:14px 16px;font-size:14.5px}
.intro b{font-weight:600}
.chead h3{font:700 19px var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 2px}
.chead p{margin:0 0 8px;color:var(--ink-2);font-size:13.5px}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-2)}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
thead th{font:600 10.5px var(--f-mono);letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
th.on,td.on{background:var(--accent-soft)}
td.src{font:500 11px var(--f-mono);color:var(--muted)}

/* ---------- sheet ---------- */
.sheetback{position:fixed;inset:0;background:rgba(6,18,20,.42);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:640px;margin:0 auto;max-height:86vh;max-height:86dvh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding:0 16px calc(22px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(18px)}to{transform:none}}
.grab{position:sticky;top:0;background:var(--surface);padding:12px 0 10px;display:flex;align-items:flex-start;gap:10px;z-index:2;border-bottom:1px solid var(--line-2)}
.sh-t{flex:1;min-width:0}
.sh-t h3{margin:0;font:700 24px/1.05 var(--f-display)}
.sh-t div{font:500 10.5px/1.5 var(--f-mono);color:var(--muted);margin-top:4px;letter-spacing:.03em}
.sec{padding:12px 0;border-bottom:1px solid var(--line-2)}
.sec:last-child{border-bottom:0}
.sec h4{margin:0 0 8px;font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.lines{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.lines li{display:flex;gap:9px}
.lines li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--tc);margin-top:8px;flex:none}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:600 11px var(--f-mono);padding:4px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);letter-spacing:.02em}
.tag.hot{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.tag.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.tag.dim{color:var(--muted);border-style:dashed}
.kv{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:6px 0}
.kv span{color:var(--ink-2)}
.kv b{font:700 18px var(--f-display)}
.status{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--good-soft);color:var(--good)}
.status b{font:700 18px var(--f-display)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.note{padding:11px 13px;border-radius:10px;background:var(--accent-soft);font-size:14px;margin-top:12px}
.note b{display:block;font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px}
.tchip{flex:none;min-width:116px;border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:11px;padding:7px 10px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.tchip.slim{min-width:0;padding:8px 12px}
.tchip b{font:700 16px/1.1 var(--f-display)}
.tchip span{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.tchip .no{color:var(--bad)}
.tchip .yes{color:var(--good)}
.tchip[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
.tchip:disabled{opacity:.45}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:46px;border-radius:10px;border:1px solid var(--line);font:600 14px var(--f-mono);background:var(--surface-2)}
.stepper output{flex:1;text-align:center;font:700 26px var(--f-display)}
.minis{display:flex;gap:8px;margin-top:8px}
.mini{flex:1;height:40px;border-radius:9px;border:1px solid var(--line);font:600 13px var(--f-display);text-transform:uppercase;letter-spacing:.05em;text-align:center}

        if (ok) add('skills', 0, 'train-ok', () => `Growth job done right: ${lead.name} runs ${tr.skill} with ${helper.name} riding along, as training approved.`, j.id, lead.id);
        else add('skills', -6, 'train-no', () => `${lead.name} is approved to learn ${tr.skill} only with a certified trainer riding along. No certified trainer is on this job.`, j.id, lead.id);
      } else add('skills', -10, 'skill', () => `${lead.name} doesn't have ${missing.join(' or ')} in ServiceTitan.`, j.id, lead.id);
    }
    if (j.tags.includes('! NO WATER HOOK UP') && !lead.water) add('skills', -8, 'water', () => `No water hookup at this house, and ${lead.name}'s truck doesn't carry water.`, j.id, lead.id);
    if (j.tags.includes('! Portable') && !lead.portable) add('skills', -8, 'portable', () => `Portable job, and ${lead.name}'s truck isn't set up for portable work.`, j.id, lead.id);
    if (j.scope.crb && !lead.crb) add('skills', -8, 'crb', () => `FiberRevive needs a CRB machine. ${lead.name} doesn't have one.`, j.id, lead.id);
    if ((lead.rules || []).includes('residential_only') && (j.commercialCustomer || j.cat === 'carpetcom')) add('skills', -8, 'resonly', () => `${lead.name}'s board stays residential. This is a commercial customer.`, j.id, lead.id);
    if (j.cat === 'redo' && lead.pay === 'Commission') add('skills', -4, 'redo', () => `Redos go to hourly techs. ${lead.name} is commission-only.`, j.id, lead.id);

    const moved = a.start < j.win[0] || a.start > j.win[1];
    if (moved){
      if (j.tags.includes('! Do not Move')) add('sop', -8, 'dnm', () => `Do Not Move job booked at ${clock(a.start)}, outside the customer's ${clock(j.win[0])}–${clock(j.win[1])} window.`, j.id);
      else add('sop', -4, 'window', () => `Booked at ${clock(a.start)}, outside the ${clock(j.win[0])}–${clock(j.win[1])} window the customer ${j.isNew ? 'asked for' : 'was promised'}.`, j.id);
    }
    const promised = a.start > j.win[1] ? a.start : j.win[1];
    if (!j.tags.includes('! FLEXIBLE TIME') && r.arr > promised + 5) add('sop', -5, 'late', () => `${lead.name} gets there at ${clock(r.arr)}, ${dur(r.arr - promised)} past the ${clock(promised)} end of the arrival window.`, j.id, lead.id);
    if (j.tags.includes('! Requested AM') && r.arr >= 720) add('sop', -4, 'am', () => `Requested AM, but ${lead.name} arrives at ${clock(r.arr)}.`, j.id);
    if (j.tags.includes('! Requested PM') && r.arr < 720) add('sop', -4, 'pm', () => `Requested PM, but ${lead.name} arrives at ${clock(r.arr)}.`, j.id);
    if ((j.tags.includes('! Specific Tech') || j.tags.includes('! Requested Tech')) && j.tech && a.tech !== j.tech) add('sop', -5, 'spec', () => `The customer asked for ${ctx.tById[j.tech].name}. It's now on ${lead.name}.`, j.id);
    const c = chartMap[j.id];
    if (c){
      const cm = c.h*60;
      if (a.dur < cm - 15) add('sop', -3, 'short', () => `Booked for ${dur(a.dur)}. The booking chart says ${dur(cm)} for ${lead.name}: ${c.parts.join(' + ')}.`, j.id, lead.id);
      else if (a.dur > cm + 90) add('sop', -1, 'long', () => `Booked for ${dur(a.dur)}, but the chart says ${dur(cm)} for ${lead.name}. That's sellable time sitting empty.`, j.id, lead.id);
    }
    if ((j.cat === 'carpet' || j.cat === 'wood') && r.arr > 960) add('sop', -3, 'afterhrs', () => `Arrives at ${clock(r.arr)}. Carpet arrivals after 4:00 PM need specialist sign-off.`, j.id);
    if (j.cat === 'duct' && r.arr > 900) add('sop', -3, 'afterhrs', () => `Arrives at ${clock(r.arr)}. The latest duct arrival is 1–3 PM.`, j.id);
  }
  for (const t of ctx.techs){
    if (ctx.unavailable.has(t.id)) continue;
    const pt = perTech[t.id], leadSeq = pt.seq.filter(s => s.lead);
    const bk = byTech[t.id].map(j => ({j, s: assign[j.id].start, e: assign[j.id].start + assign[j.id].dur})).sort((x, y) => x.s - y.s);
    for (let i = 1; i < bk.length; i++) if (bk[i].s < bk[i-1].e) add('sop', -3, 'overlap', () => `${t.name} is booked on two jobs at once: ${bk[i-1].j.city} and ${bk[i].j.city}.`, bk[i].j.id, t.id);
    for (const s of pt.seq){
      for (const b of t.blocks){
        if (b.callout || (t.hardStop && b.start >= t.hardStop.min && t.hardStop.dow === sc.dow)) continue;
        if (b.end > s.arr && b.start < s.end){ add('sop', -6, 'block', () => `${t.name}'s ${s.job.city} job runs into the "${b.label}" block (${clock(b.start)}–${clock(b.end)}).`, s.job.id, t.id); break; }
      }
    }
    if (t.hardStop && t.hardStop.dow === sc.dow && pt.lastEnd != null && pt.lastEnd > t.hardStop.min) add('sop', -8, 'hardstop', () => `${t.name} has a hard stop at ${clock(t.hardStop.min)} and is working until ${clock(pt.lastEnd)}.`, leadSeq.length ? leadSeq[leadSeq.length-1].job.id : null, t.id);
    if (t.maxJobs && leadSeq.length > t.maxJobs) add('sop', -6, 'maxjobs', () => `${t.name}'s board is blocked at ${t.maxJobs} jobs, and he has ${leadSeq.length}.`, null, t.id);
    const areas = leadSeq.reduce((n, s) => n + (s.job.scope.areas || 0), 0);
    if (areas > 20) add('sop', -6, 'cap', () => `${t.name} has ${areas} carpet areas. The daily max is 20.`, null, t.id);
    const sq = leadSeq.reduce((n, s) => n + (s.job.cat === 'duct' ? (s.job.scope.sqft || 0) : 0), 0);
    if (sq > 6000) add('sop', -6, 'cap', () => `${t.name} has ${sq.toLocaleString()} sq ft of ducts. The daily max is 6,000.`, null, t.id);
    if (pt.lastEnd != null && pt.lastEnd > 1050) add('sop', -3, 'eod', () => `${t.name} finishes around ${clock(pt.lastEnd)}, past 5:30 PM.`, null, t.id);
  }
  const ded = k => -items.filter(i => i.k === k).reduce((n, i) => n + i.pts, 0);
  return {items, lost, later, driveTotal, crossings, skillsDed: ded('skills'), sopDed: ded('sop'), recs, perTech, chartMap, late: items.filter(i => i.key === 'late').length};
}

/* ---------- another day ---------- */
// Moving a job to another day is right when the best board also can't fit it today
// (capacity, skills, hard stops). If the best board fits it, moving it costs 8 in SOP.
// A Do Not Move job was promised today, so moving it is always charged.
const LATER_DED = 8;
function judgeLater(ctx, ev, bench){
  const items = [], ba = bench.assign;
  for (const id of ev.later){
    const j = ctx.jById[id], b = ba[id], label = `${id} ${j.city}`;
    if (j.tags.includes('! Do not Move')) items.push({k:'sop', pts:-LATER_DED, key:'later-dnm', job:id, tech:null, text:`${label} is Do Not Move. The customer was promised this day, so it can't go to another day.`});
    else if (b && b.later) items.push({k:'sop', pts:0, key:'later-ok', job:id, tech:null, text:`Right call on ${label}: with the techs and hours on this board it doesn't fit today, so another day is correct.`});
    else { const t = b && b.tech ? ctx.tById[b.tech] : null; items.push({k:'sop', pts:-LATER_DED, key:'later-fit', job:id, tech: t ? t.id : null, text:`${label} went to another day, but this job fit today${t ? ` on ${t.name}` : ''}.`}); }
  }
  return items;
}
// Drive the "other" board would have spent on jobs one board ran today and the other moved,
// so routing compares like with like (one leg out from the shop per job).
function laterDriveAdj(ctx, ev, bench){
  let mine = 0, best = 0;
  for (const j of ctx.jobs){
    const a = bench.assign[j.id], meLater = ev.later.includes(j.id), bLater = !!(a && a.later);
    if (bLater && !meLater) best += ctx.dm[0][j._i];
    if (meLater && !bLater) mine += ctx.dm[0][j._i];
  }
  return {mine, best};
}
function scoreOf(ev, bd, extra){
  extra = extra || {laterDed: 0, adj: {mine: 0, best: 0}};
  if (ev.lost.length) return {total:0, routing:0, skills:0, sop:0, zero:true, over:0, cross:0};
  const skills = 30 - Math.min(30, Math.max(0, ev.skillsDed - bd.skillsDed));
  const sop = 30 - Math.min(30, Math.max(0, ev.sopDed + extra.laterDed - bd.sopDed));
  const mine = ev.driveTotal + extra.adj.mine, best = bd.driveTotal + extra.adj.best;
  const over = Math.max(0, mine - best) / Math.max(1, best);
  const cross = Math.max(0, ev.crossings - bd.crossings);
  const routing = Math.max(0, 40 - Math.min(40, Math.round(40*over)) - Math.min(12, 3*cross));
  return {total: routing + skills + sop, routing, skills, sop, zero:false, over, cross, mine, best};
}
function fullScore(ctx, assign, bench){
  const ev = evaluate(ctx, assign), bd = bench.ev;
  const later = judgeLater(ctx, ev, bench), laterDed = -later.reduce((n, i) => n + i.pts, 0);
  const sc = scoreOf(ev, bd, {laterDed, adj: laterDriveAdj(ctx, ev, bench)});
  return {ev, bd, later, sc};
}

/* ---------- best-board search (deterministic, cached per phone) ---------- */
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const benchCache = {};
const LATER = '__later';
function benchFor(ctx, opts){
  opts = opts || {};
  const id = ctx.sc.id, key = 'dd-bench-v7-' + id + '-' + hashStr(JSON.stringify(ctx.sc.jobs) + JSON.stringify(ctx.sc.techs));
  if (benchCache[id] && !opts.fresh) return benchCache[id];
  const cached = opts.fresh ? null : store.get(key, null);
  // Boards ship with a best board found offline by a long search (sc.bench), so every phone
  // scores against the same reference. The in-browser search is only a fallback.
  const pre = !opts.fresh && ctx.sc.bench;
  if (pre && ctx.jobs.every(j => pre[j.id])) return (benchCache[id] = Promise.resolve({assign: pre, ev: evaluate(ctx, pre)}));
  if (cached && cached.assign && ctx.jobs.every(j => cached.assign[j.id])) return (benchCache[id] = Promise.resolve({assign: cached.assign, ev: evaluate(ctx, cached.assign)}));
  return (benchCache[id] = new Promise(resolve => {
    const rng = mulberry32(hashStr(id) ^ (opts.seed || 0));
    const avail = ctx.techs.filter(t => !ctx.unavailable.has(t.id)).map(t => t.id);
    const slots = avail.concat([LATER]);
    const lists = {}; slots.forEach(t => { lists[t] = []; });
    ctx.jobs.slice().sort((x, y) => x.start - y.start).forEach(j => { const t = (j.tech && lists[j.tech] && j.tech !== LATER) ? j.tech : avail[Math.floor(rng()*avail.length)]; lists[t].push(j.id); });
    const decode = L => {
      const a = {};
      for (const tid of avail){
        const t = ctx.tById[tid]; let clk = DEPART, li = 0;
        for (const id of L[tid]){
          const j = ctx.jById[id], dr = ctx.dm[li][j._i], earliest = clk + dr;
          const st = j.tags.includes('! Do not Move') ? j.start : Math.max(j.win[0], Math.ceil(earliest/15)*15);
          const c = chartFor(ctx, j, t), d = c ? Math.round(c.h*60) : j.dur;
          a[id] = {tech: tid, helper: null, start: st, dur: d}; clk = Math.max(st, earliest) + d; li = j._i;
        }
      }
      for (const id of L[LATER]){ const j = ctx.jById[id]; a[id] = {tech: null, helper: null, start: j.start, dur: j.dur, later: true}; }
      return a;
    };
    // Moving a job costs about 40 points' worth plus its round trip, so the search only
    // moves work that would cost more than that to fit today. Do Not Move never moves.
    const laterCost = L => L[LATER].reduce((n, id) => { const j = ctx.jById[id]; return n + (j.tags.includes('! Do not Move') ? 5000 : 7*40 + 2*ctx.dm[0][j._i]); }, 0);
    // Skills are a hard rule (jobs go to techs by the skills they have), so a skills miss costs
    // more than moving the job. Search-only pressure on top of the score: every minute a tech works past 5:30 PM and every
    // minute a start slips past the customer's window costs extra, so the search never "fits" a job
    // by pushing it into the evening. Real days like that move work to another day instead.
    const stretch = ev => { let m = 0; for (const t of avail){ const pt = ev.perTech[t]; if (pt.lastEnd != null) m += Math.max(0, pt.lastEnd - 1050); } for (const id in ev.recs){ const j = ctx.jById[id]; m += 1.5*Math.max(0, ev.recs[id].arr - j.win[1]); } return m; };
    // Hard stops, dispatch blocks, job caps and daily capacity are real limits too.
    const HARD = {hardstop:1, block:1, maxjobs:1, cap:1};
    const hard = ev => -ev.items.reduce((n, i) => n + (HARD[i.key] ? i.pts : 0), 0);
    const cost = L => { const ev = evaluate(ctx, decode(L), true); return ev.driveTotal + 25*ev.skillsDed + 7*ev.sopDed + 18*hard(ev) + 10*ev.crossings + 500*ev.lost.length + laterCost(L) + stretch(ev); };
    const clone = L => { const o = {}; for (const k in L) o[k] = L[k].slice(); return o; };
    const mutate = L => {
      const c = clone(L), r = rng(), full = slots.filter(t => c[t].length), work = avail.filter(t => c[t].length);
      const any = arr => arr[Math.floor(rng()*arr.length)];
      if (r < 0.55){ const from = any(full); const [id] = c[from].splice(Math.floor(rng()*c[from].length), 1); const to = rng() < 0.08 ? LATER : any(avail); c[to].splice(Math.floor(rng()*(c[to].length + 1)), 0, id); }
      else if (r < 0.85){ const t1 = any(full), t2 = any(full); const i = Math.floor(rng()*c[t1].length), k = Math.floor(rng()*c[t2].length); const tmp = c[t1][i]; c[t1][i] = c[t2][k]; c[t2][k] = tmp; }
      else if (work.length){ const t = any(work), n = c[t].length; if (n > 1){ let i = Math.floor(rng()*n), k = Math.floor(rng()*n); if (i > k) [i, k] = [k, i]; const seg = c[t].slice(i, k + 1).reverse(); c[t].splice(i, seg.length, ...seg); } }
      return c;
    };
    let cur = lists, curC = cost(cur), best = clone(cur), bestC = curC, it = 0;
    const N = opts.iters || 30000, T0 = 90, T1 = 0.5;
    // Polish: try every single-job move (any tech, any slot, or another day) and every swap,
    // keep whatever helps, and repeat until nothing does.
    const polish = () => {
      let improved = true, guard = 0;
      while (improved && guard++ < 60){
        improved = false;
        for (const from of slots) for (let i = 0; i < best[from].length; i++){
          for (const to of slots){
            const n = to === from ? best[to].length - 1 : best[to].length;
            for (let k = 0; k <= n; k++){
              const c = clone(best), [id] = c[from].splice(i, 1); c[to].splice(k, 0, id);
              const cc = cost(c); if (cc < bestC - 1e-9){ best = c; bestC = cc; improved = true; break; }
            }
            if (improved) break;
          }
          if (improved) break;
        }
        if (improved) continue;
        outer: for (const t1 of slots) for (let i = 0; i < best[t1].length; i++) for (const t2 of slots) for (let k = 0; k < best[t2].length; k++){
          if (t1 === t2 && k <= i) continue;
          const c = clone(best), tmp = c[t1][i]; c[t1][i] = c[t2][k]; c[t2][k] = tmp;
          const cc = cost(c); if (cc < bestC - 1e-9){ best = c; bestC = cc; improved = true; break outer; }
        }
      }
    };
    const finish = () => { polish(); const assign = decode(best); if (!opts.fresh) store.set(key, {assign}); resolve({assign, ev: evaluate(ctx, assign), cost: bestC}); };
    const step = () => {
      const stop = Math.min(N, it + 800);
      for (; it < stop; it++){
        const T = T0*Math.pow(T1/T0, it/N), cand = mutate(cur), cc = cost(cand);
        if (cc < curC || rng() < Math.exp((curC - cc)/T)){ cur = cand; curC = cc; if (cc < bestC){ best = clone(cand); bestC = cc; } }
      }
      if (it < N) setTimeout(step, 0); else finish();
    };
    setTimeout(step, opts.sync ? 0 : 40);
  }));
}

function isoWeek(d){

}

function trainingFor(items, sc){
  const agg = {};
  const bump = (key, n) => { const t = TOPICS[key]; if (!t) return; const a = agg[t[0]] || (agg[t[0]] = {topic: t[0], why: t[1], count: 0}); a.count += n || 1; };
  items.forEach(i => { if (i.pts < 0) bump(i.key); });

const tcol = t => t ? `var(--t${t.ci})` : 'var(--bad)';

function renderMap(ev){
  const ctx = S.ctx, W = 360, H = 440, pad = 30, mkt = S.sc.market;
  const pts = [ctx.shop].concat(ctx.jobs.map(j => [j.lat, j.lon]));
  const mid = pts.reduce((s, p) => s + p[0], 0)/pts.length, kx = Math.cos(mid*Math.PI/180);
  const X = p => p[1]*kx, Y = p => -p[0];
  const x0 = Math.min(...pts.map(X)), x1 = Math.max(...pts.map(X)), y0 = Math.min(...pts.map(Y)), y1 = Math.max(...pts.map(Y));
  const k = Math.min((W - 2*pad)/Math.max(1e-6, x1 - x0), (H - 2*pad)/Math.max(1e-6, y1 - y0));
  const ox = (W - (x1 - x0)*k)/2, oy = (H - (y1 - y0)*k)/2;
  const P = p => [ox + (X(p) - x0)*k, oy + (Y(p) - y0)*k];
  const m = B.model[mkt], [sx, sy] = P(ctx.shop);
  let svg = `<rect width="${W}" height="${H}" fill="var(--surface)"/>`;
  for (const mm of [30, 45, 60]){ const km = Math.pow(Math.max(0, (mm - m.a)/m.b), 1/m.p), r = km*k/111.32; svg += `<circle class="m-ring" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${r.toFixed(1)}"/><text class="m-ringl" x="${(sx + r*0.72 + 3).toFixed(1)}" y="${(sy - r*0.70).toFixed(1)}">${mm} min</text>`; }
  const placed = [];
  B.zones.filter(z => z.m === mkt).sort((a, b) => b.jobs - a.jobs).forEach(z => {
    if (placed.length >= 14) return; const [cx, cy] = P([z.lat, z.lon]);
    if (cx < 12 || cx > W - 12 || cy < 12 || cy > H - 12) return;
    if (placed.some(q => Math.abs(q[0] - cx) < 46 && Math.abs(q[1] - cy) < 16)) return;
    placed.push([cx, cy]); svg += `<circle class="m-cdot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="1.6"/><text class="m-city" x="${cx.toFixed(1)}" y="${(cy + 12).toFixed(1)}" text-anchor="middle">${esc(z.city)}</text>`;
  });
  for (const t of ctx.techs){
    const pt = ev.perTech[t.id]; if (!pt || !pt.seq.length) continue;
    const lead = [ctx.shop].concat(pt.seq.map(s => [s.job.lat, s.job.lon])).concat([ctx.shop]).map(P).map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
    svg += `<polyline class="m-route${pt.seq.every(s => !s.lead) ? ' help' : ''}" points="${lead}" style="stroke:${tcol(t)}"/>`;
  }
  svg += `<rect class="m-shop" x="${(sx - 7).toFixed(1)}" y="${(sy - 7).toFixed(1)}" width="14" height="14" rx="3"/><text class="m-shopl" x="${(sx + 11).toFixed(1)}" y="${(sy + 4).toFixed(1)}">SHOP</text>`;
  const lostSet = new Set(ev.lost.map(l => l.job));
  for (const j of ctx.jobs){
    if (S.assign[j.id].later) continue;
    const [cx, cy] = P([j.lat, j.lon]), a = S.assign[j.id], t = a.tech ? ctx.tById[a.tech] : null, un = lostSet.has(j.id);
    svg += `<g class="m-pin${un ? ' un' : ''}" data-act="job" data-id="${j.id}" role="button" tabindex="0" aria-label="${esc(j.id + ' ' + j.city)}"><circle class="hit" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="17"/><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="10" style="fill:${tcol(t)}"/><text x="${cx.toFixed(1)}" y="${(cy + 3).toFixed(1)}" text-anchor="middle">${j.id.slice(1)}</text></g>`;
  }
  const legend = ctx.techs.map(t => { const pt = ev.perTech[t.id], out = ctx.unavailable.has(t.id); const n = pt ? pt.seq.filter(s => s.lead).length : 0; return `<button class="lg" data-act="tech" data-id="${t.id}"><i class="dot" style="--tc:${tcol(t)}"></i><span><b>${esc(t.name)}</b> ${out ? 'called out' : `${n} job${n === 1 ? '' : 's'} · ${dur(pt ? pt.drive : 0)} driving`}</span></button>`; }).join('');
  return `<div class="mapwrap"><svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of today's jobs and routes from the ${esc(B.markets[mkt].shopName)}">${svg}</svg>
    <p class="foot" style="margin:8px 2px 0">Dashed rings are drive time from the shop. Lines follow each tech's booked order. Tap a pin to open the job.</p>
    <div class="legend">${legend}</div></div>`;
}

function priorJob(tid, j){
  let prev = null;
  for (const k of S.ctx.jobs){ if (k.id === j.id) continue; const b = S.assign[k.id]; if (b.later || (b.tech !== tid && b.helper !== tid)) continue; if (b.start <= S.assign[j.id].start && (!prev || b.start > S.assign[prev.id].start)) prev = k; }
  return prev;
}
function fitAfter(id){
  const ctx = S.ctx, j = ctx.jById[id], a = S.assign[id]; if (!a.tech) return a.start;
  const prev = priorJob(a.tech, j);
  const earliest = prev ? S.assign[prev.id].start + S.assign[prev.id].dur + ctx.dm[prev._i][j._i] : DEPART + ctx.dm[0][j._i];
  return clamp(Math.max(j.win[0], Math.ceil(earliest/15)*15), DAY0, DAY1 - 30);
}

const who = (ctx, a) => a.later ? 'Another day' : a.tech && ctx.tById[a.tech] ? ctx.tById[a.tech].name + (ctx.unavailable.has(a.tech) ? ' (called out)' : '') : 'No tech';
function diffsFor(ctx, assign, bench){
  const out = [];
  for (const j of ctx.jobs){
    const mine = who(ctx, assign[j.id]), best = who(ctx, bench.assign[j.id]);
    if (mine !== best) out.push({job: `${j.id} ${j.city}`, id: j.id, yours: mine, best});
  }
  return out;
}
function renderResults(bench){

  S.F = F;
  if (S.mode === 'practice' && !S.revealed){ const k = 'dd-best-' + S.sc.id, prev = store.get(k, null); if (prev == null || sc.total > prev) store.set(k, sc.total); }
  const verdict = sc.zero ? 'Lost job' : sc.total >= 90 ? 'Dispatch ready' : sc.total >= 75 ? 'Solid board' : sc.total >= 50 ? 'Needs a second look' : 'Rebuild this board';

  const skills = ev.items.filter(i => i.k === 'skills' && i.pts < 0), sop = ev.items.filter(i => i.k === 'sop' && i.pts < 0), goods = ev.items.filter(i => i.pts >= 0);

  const benchLater = ctx.jobs.filter(j => bench.assign[j.id] && bench.assign[j.id].later && !ev.later.includes(j.id));
  const pct = Math.round(100*sc.over);
  const adjNote = sc.zero ? '' : (sc.mine - ev.driveTotal) || (sc.best - bd.driveTotal) ? ' Jobs that only one board moved to another day count one trip out from the shop, so both boards are compared on the same work.' : '';

    <div class="rtop"><button class="btn" data-act="back">‹ Keep editing</button><p class="eyebrow">${S.mode === 'test' ? 'Weekly test · ' : 'Practice · '}${esc(S.sc.title)}</p></div>
    <div><div class="score"><b>${sc.total}</b><span>/ 100</span></div><div class="verdict${sc.zero || sc.total < 50 ? ' bad' : ''}">${verdict}</div></div>

    ${submit}
    <div class="cmp"><div class="cmpi you"><span>Your board</span><b>${dur(ev.driveTotal)}</b></div><div class="cmpi"><span>As booked</span><b>${dur(booked.driveTotal)}</b></div><div class="cmpi"><span>Best found</span><b>${dur(bd.driveTotal)}</b></div></div>

    ${(S.mode === 'practice' || S.submitted || S.revealed) && diffs.length ? `<section class="rsec"><h3>Best board, side by side</h3><div class="tscroll"><table class="diff"><thead><tr><th>Job</th><th>Yours</th><th>Best board</th></tr></thead><tbody>${diffs.map(d => `<tr><td>${esc(d.job)}</td><td>${esc(d.yours)}</td><td>${esc(d.best)}</td></tr>`).join('')}</tbody></table></div></section>` : ''}
    ${goods.length ? `<section class="rsec"><h3>Done right</h3><div class="ded">${goods.map(item).join('')}</div></section>` : ''}
    <div class="ractions">${S.mode === 'practice' || S.submitted ? '<button class="btn" data-act="reveal">Show the best board</button>' : ''}${S.mode === 'practice' || !S.submitted ? '<button class="btn" data-act="reset" id="resetBtn2">Start over</button>' : ''}<button class="btn" data-act="home">All boards</button></div>
  </div>`;
}
function payloadFor(name){
  const ctx = S.ctx, F = S.F, ev = F.ev, sc = F.sc;
  return {
    name, week: WEEK.key,
    board: {id: S.sc.id, title: S.sc.title, dateLabel: S.sc.dateLabel, market: S.sc.market},
    score: {total: sc.total, routing: sc.routing, skills: sc.skills, sop: sc.sop, zero: !!sc.zero},
    drive: {yours: Math.round(sc.zero ? ev.driveTotal : sc.mine), best: Math.round(sc.zero ? F.bd.driveTotal : sc.best), booked: evaluate(ctx, initialAssign(S.sc), true).driveTotal, crossYours: ev.crossings, crossBest: F.bd.crossings},
    misses: ev.items.filter(i => i.pts < 0).slice(0, 60).map(i => ({k: i.k, pts: i.pts, text: i.text})),
    goods: ev.items.filter(i => i.pts >= 0).slice(0, 30).map(i => ({text: i.text})),
    diffs: diffsFor(ctx, S.assign, S.bench).slice(0, 40).map(d => ({job: d.job, yours: d.yours, best: d.best})),
    training: trainingFor(ev.items.concat(F.later), sc).slice(0, 12),
    lost: ev.lost.map(l => ({job: `${l.job} ${ctx.jById[l.job].city}`, why: l.why})),
    later: F.later.map(i => ({job: `${i.job} ${ctx.jById[i.job].city}`, ok: i.pts >= 0, note: i.text})),
    prompts: S.sc.prompts.length, handled: S.sc.prompts.filter(p => S.handled[p.id]).length

}

  const sel = $('#who2'), name = sel ? sel.value : '', btn = $('#submitBtn'), note = $('#subNote');
  if (!name){ if (sel) sel.focus(); note.textContent = 'Pick your name first.'; return; }
  store.set('dd-name', name);
  btn.disabled = true; btn.textContent = 'Sending…'; note.textContent = '';
  let res, body = {};
  try {
    res = await fetch(API, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payloadFor(name))});
    try { body = await res.json(); } catch (e){}
  } catch (e){ btn.disabled = false; btn.textContent = 'Try again'; note.textContent = 'Couldn\'t reach the server. Check your signal and try again.'; return; }
  if (res.ok && body.ok){
    if (!body.emailed){ btn.disabled = false; btn.textContent = 'Try again'; note.textContent = 'Your score was saved, but the email didn\'t go out. Tap Try again in a minute.'; return; }
    const when = new Date().toLocaleString('en-US', {weekday:'short', hour:'numeric', minute:'2-digit'});
    S.submitted = {total: S.F.sc.total, when, name};
    store.set(`dd-sub-${WEEK.key}-${S.sc.id}`, S.submitted);
    renderResults(S.bench); window.scrollTo(0, 0); return;
  }
  btn.disabled = false; btn.textContent = 'Try again';
  note.textContent = res.status === 409 ? (body.message || 'This test is already in for you this week.') : res.status === 429 ? 'Too many tries this hour. Wait a bit and try again.' : 'Something went wrong sending it. Try again.';
  if (res.status === 409){ btn.disabled = true; btn.textContent = 'Already submitted'; }
}

/* ---------- events ---------- */
function resetBoard(){
  store.del(S.kp + 'assign'); store.del(S.kp + 'revealed'); store.del(S.kp + 'handled');
  S.assign = initialAssign(S.sc); S.revealed = false; S.handled = {}; S.sheet = null;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const cur = S && S.sheet && S.sheet.job ? S.assign[S.sheet.job] : null;
  switch (act){
    case 'play': play(id, el.dataset.mode === 'test' ? 'test' : 'practice'); break;
    case 'home': S = null; show('home'); renderHome(); window.scrollTo(0, 0); break;
    case 'tab': S.view = el.dataset.v; store.set('dd-view', S.view); S.sheet = null; renderGame(); break;
    case 'job': openJob(id); break;
    case 'tech': S.sheet = {tech: id}; renderSheet(); break;
    case 'close': closeSheet(false); break;
    case 'assign': if (cur){ const tid = el.dataset.tech || null, was = cur.later || !cur.tech; cur.tech = tid; cur.later = false; if (cur.helper === tid) cur.helper = null; if (was) cur.start = fitAfter(S.sheet.job); commit(); } break;
    case 'later': if (cur){ cur.later = true; cur.tech = null; cur.helper = null; commit(); } break;
    case 'helper': if (cur){ cur.helper = el.dataset.tech || null; commit(); } break;
    case 'start': if (cur){ cur.start = clamp(cur.start + Number(el.dataset.d), DAY0, DAY1 - 30); commit(); } break;
    case 'dur': if (cur){ cur.dur = clamp(cur.dur + Number(el.dataset.d), 30, 720); commit(); } break;
    case 'fit': if (cur){ cur.start = fitAfter(S.sheet.job); commit(); } break;
    case 'winstart': if (cur){ cur.start = S.ctx.jById[S.sheet.job].win[0]; commit(); } break;
    case 'handled': S.handled[el.dataset.p] = !S.handled[el.dataset.p]; store.set(S.kp + 'handled', S.handled); renderGame(); break;
    case 'lock': lock(); break;
    case 'back': show('game'); renderGame(); break;
    case 'gojob': show('game'); openJob(id); break;
    case 'gotech': show('game'); S.sheet = {tech: id}; renderGame(); break;
    case 'reveal': S.benchP.then(b => { S.assign = JSON.parse(JSON.stringify(b.assign)); S.revealed = true; store.set(S.kp + 'revealed', true); store.set(S.kp + 'assign', S.assign); show('game'); renderGame(); }); break;
    case 'reset':
      if (el.dataset.armed !== '1'){ el.dataset.armed = '1'; el.textContent = 'Tap again to start over'; setTimeout(() => { if (el.isConnected){ el.dataset.armed = ''; el.textContent = 'Start over'; } }, 3000); break; }
      el.dataset.armed = ''; resetBoard(); show('game'); renderGame(); break;
    case 'submit': submitTest(); break;
  }
});
document.addEventListener('change', e => { if (e.target.id === 'who' || e.target.id === 'who2') store.set('dd-name', e.target.value); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S && S.sheet) closeSheet(false);
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('m-pin')){ e.preventDefault(); openJob(e.target.dataset.id); }
});

window.DD = {B, ctxFor, initialAssign, evaluate, benchFor, fullScore, scoreOf, judgeLater, chartFor, weekTests, isoWeek, WEEK, get S(){ return S; }};
renderHome();
})();
</script>
