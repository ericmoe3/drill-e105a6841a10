<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-title" content="Dispatch Drill"><meta name="apple-mobile-web-app-capable" content="yes"><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Alpine Dispatch Drill</title>
<meta name="theme-color" content="#0A5B64">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#EDF2F1; --surface:#FFFFFF; --surface-2:#F4F8F7; --line:#D3DEDC; --line-2:#E3EBEA;
  --ink:#0F2428; --ink-2:#3B5357; --muted:#657C80;
  --accent:#0A5B64; --accent-ink:#FFFFFF; --accent-soft:#D5EAEA;
  --window:#C08416; --bad:#BD3829; --bad-soft:#F7DDD8; --good:#1F7F55; --good-soft:#D6EEE1;
  --block:#8C9C9E; --pin-ink:#FFFFFF; --shadow:0 -8px 30px rgba(15,36,40,.16);
  --t0:#2F6FD0; --t1:#D2691E; --t2:#23875A; --t3:#B03F78; --t4:#7152C4; --t5:#977708; --t6:#12909C;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --lab:108px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A1416; --surface:#111F22; --surface-2:#16282B; --line:#283C3F; --line-2:#1C2F32;
    --ink:#E2EDED; --ink-2:#B3C6C8; --muted:#86A2A5;
    --accent:#5BBEC7; --accent-ink:#052528; --accent-soft:#163A3E;
    --window:#E3AA3E; --bad:#F07262; --bad-soft:#3A1D19; --good:#58C68C; --good-soft:#15342A;
    --block:#6E8487; --pin-ink:#06171A; --shadow:0 -8px 30px rgba(0,0,0,.55);
    --t0:#72A4F2; --t1:#F0934C; --t2:#52C08B; --t3:#E57DB1; --t4:#A68EF2; --t5:#D8B53E; --t6:#4FC7D2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0A1416; --surface:#111F22; --surface-2:#16282B; --line:#283C3F; --line-2:#1C2F32;
  --ink:#E2EDED; --ink-2:#B3C6C8; --muted:#86A2A5;
  --accent:#5BBEC7; --accent-ink:#052528; --accent-soft:#163A3E;
  --window:#E3AA3E; --bad:#F07262; --bad-soft:#3A1D19; --good:#58C68C; --good-soft:#15342A;
  --block:#6E8487; --pin-ink:#06171A; --shadow:0 -8px 30px rgba(0,0,0,.55);
  --t0:#72A4F2; --t1:#F0934C; --t2:#52C08B; --t3:#E57DB1; --t4:#A68EF2; --t5:#D8B53E; --t6:#4FC7D2;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text]{height:44px;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 12px;font:500 15px var(--f-body)}
.eyebrow{font:600 11px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.linkbtn{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* ---------- home ---------- */
.home{max-width:600px;margin:0 auto;padding:30px 18px 60px;display:flex;flex-direction:column;gap:30px}
.wordmark{font:700 68px/.84 var(--f-display);text-transform:uppercase;letter-spacing:-.005em;margin:12px 0 0}
.wordmark span{display:block;color:var(--accent)}
.lede{margin:14px 0 0;color:var(--ink-2);font-size:16.5px;max-width:44ch}
.field{display:grid;gap:6px}
.field label{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;gap:12px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:100%}
.card:hover{border-color:var(--accent)}
.shield{width:44px;height:50px;display:grid;place-items:center;padding-bottom:8px;font:700 18px/1 var(--f-display);letter-spacing:.02em;color:var(--accent-ink);background:var(--accent);clip-path:polygon(8% 0,92% 0,100% 16%,100% 60%,50% 100%,0 60%,0 16%)}
.shield.az{background:var(--window);color:#1B1403}
.cbody{display:grid;gap:2px;min-width:0}
.cbody h3{margin:0;font:700 23px/1.05 var(--f-display);letter-spacing:.01em}
.cbody .date{color:var(--ink-2);font-size:14.5px}
.meta{font:500 10.5px/1.5 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.best{text-align:right;font:700 30px/1 var(--f-display)}
.best small{display:block;font:500 9.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.rules h2{font:700 22px var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.rule{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.rule > b{font:700 34px/1 var(--f-display)}
.rule h4{margin:0;font:600 16px var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.rule p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.rule.zero > b{color:var(--bad)}
.foot{font-size:12.5px;color:var(--muted);margin:0;max-width:60ch}

/* ---------- game shell ---------- */
.game{display:flex;flex-direction:column;height:100vh;height:100dvh}
.gbar{flex:none;background:var(--surface);border-bottom:1px solid var(--line)}
.gtop{display:flex;align-items:center;gap:10px;padding:10px 12px 8px}
.iconbtn{width:38px;height:38px;flex:none;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font:600 18px var(--f-body)}
.gtitle{min-width:0;flex:1}
.gtitle h2{margin:0;font:700 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtitle div{font:500 10.5px var(--f-mono);color:var(--muted);letter-spacing:.05em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reads{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto}
.read{flex:none;display:flex;align-items:baseline;gap:7px;padding:5px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2)}
.read span{font:600 10px var(--f-mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.read b{font:700 17px/1 var(--f-display)}
.read.alert{background:var(--bad-soft);border-color:transparent}
.read.alert b,.read.alert span{color:var(--bad)}
.tabs{display:flex;padding:0 4px}
.tab{flex:1;text-align:center;padding:9px 2px 8px;font:600 14.5px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2.5px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tab i{font-style:normal;display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font:600 10px var(--f-mono);margin-left:4px;padding:0 4px;vertical-align:1px}
.gmain{flex:1;min-height:0;overflow:auto;position:relative;overscroll-behavior:contain}
.dock{flex:none;display:flex;gap:10px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.btn{height:46px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font:600 15px var(--f-display);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.btn.primary{flex:1;height:50px;background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:19px;letter-spacing:.07em}
.btn[data-armed="1"]{border-color:var(--bad);color:var(--bad)}

/* ---------- board ---------- */
.tray{position:sticky;left:12px;max-width:calc(100vw - 24px);margin:10px 12px 0;padding:10px;border:1.5px dashed var(--bad);border-radius:12px;background:var(--bad-soft)}
.tray-h{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--bad);margin-bottom:8px}
.tray-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.jchip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:150px;display:grid;gap:2px}
.jchip b{font-weight:600;font-size:13.5px}
.jchip span{font-size:12px;color:var(--ink-2)}
.new{font:600 9.5px var(--f-mono);font-style:normal;color:var(--accent-ink);background:var(--accent);padding:1px 4px;border-radius:3px;margin-left:4px;vertical-align:1px}
.grid{position:relative;margin-top:10px}
.ruler{position:sticky;top:0;z-index:6;display:flex;height:26px;background:var(--surface);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.corner{position:sticky;left:0;z-index:7;flex:none;width:var(--lab);background:var(--surface);border-right:1px solid var(--line);font:600 10px var(--f-mono);color:var(--muted);display:flex;align-items:center;padding-left:12px;letter-spacing:.1em}
.ticks{position:relative;flex:none}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font:500 10px var(--f-mono);color:var(--muted);padding:6px 0 0 4px;white-space:nowrap}
.row{display:flex;height:84px;border-bottom:1px solid var(--line)}
.who{position:sticky;left:0;z-index:5;flex:none;width:var(--lab);background:var(--surface);border-right:1px solid var(--line);border-left:4px solid var(--tc);padding:8px 6px 6px 9px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.who b{font:700 17px/1 var(--f-display);letter-spacing:.02em}
.who small{font:500 9.5px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.eq{display:flex;gap:3px;flex-wrap:wrap}
.eqc{font:600 8.5px/1 var(--f-mono);padding:2px 4px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);letter-spacing:.03em}
.eqc.hot{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.lane{position:relative;flex:none;background-color:var(--surface-2);background-image:linear-gradient(90deg,var(--line-2) 1px,transparent 1px);overflow:hidden}
.job{position:absolute;top:8px;height:46px;border-radius:7px;background:color-mix(in oklab,var(--tc) 15%,var(--surface));border:1px solid color-mix(in oklab,var(--tc) 45%,transparent);border-left:4px solid var(--tc);padding:4px 6px 0 6px;overflow:hidden;font-size:12px;line-height:1.25;z-index:2;display:block}
.job.helper{border-style:dashed;background:color-mix(in oklab,var(--tc) 6%,var(--surface))}
.job.lost{border-color:var(--bad);border-left-color:var(--bad);background:var(--bad-soft)}
.job.sel{box-shadow:0 0 0 2px var(--ink);z-index:4}
.job .c{display:flex;gap:5px;align-items:baseline;font-weight:600;white-space:nowrap;overflow:hidden;padding-right:2px}
.jid{font:600 10px var(--f-mono);color:var(--muted)}
.job .s{display:block;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flags{position:absolute;right:3px;bottom:3px;display:flex;gap:2px}
.flg{font:600 8.5px/1 var(--f-mono);padding:2px 3px;border-radius:3px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.flg.hot{border-color:var(--bad);color:#fff;background:var(--bad)}
.real{position:absolute;top:59px;height:6px;border-radius:3px;background:color-mix(in oklab,var(--tc) 65%,transparent);z-index:1}
.over{position:absolute;top:59px;height:6px;border-radius:0 3px 3px 0;background:repeating-linear-gradient(135deg,var(--bad) 0 3px,transparent 3px 6px);z-index:1}
.drv{position:absolute;top:56px;font:500 9.5px var(--f-mono);color:var(--muted);transform:translateX(-100%);padding-right:4px;white-space:nowrap}
.win{position:absolute;top:73px;height:3px;border-radius:2px;background:var(--window);opacity:.85}
.blk{position:absolute;top:5px;bottom:5px;border-radius:7px;border:1px dashed var(--block);background:repeating-linear-gradient(135deg,color-mix(in oklab,var(--block) 22%,transparent) 0 5px,transparent 5px 10px);font:500 9.5px/1.25 var(--f-mono);color:var(--muted);padding:4px 5px;overflow:hidden;z-index:1;pointer-events:none}
.blk.callout{border-color:var(--bad);color:var(--bad);font-weight:600;background:repeating-linear-gradient(135deg,color-mix(in oklab,var(--bad) 13%,transparent) 0 5px,transparent 5px 10px);z-index:3;display:flex;justify-content:flex-end}
.stop{position:absolute;top:0;bottom:0;border-left:2px solid var(--bad);z-index:3;pointer-events:none}
.stop span{position:absolute;top:3px;left:4px;font:600 8.5px var(--f-mono);color:var(--bad);white-space:nowrap;letter-spacing:.05em}
.key{position:sticky;left:0;max-width:100vw;padding:12px 14px 20px;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--ink-2)}
.key span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:6px;border-radius:3px}

/* ---------- map ---------- */
.mapwrap{padding:12px 12px 24px;max-width:600px;margin:0 auto}
.map{display:block;width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.m-ring{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 4}
.m-ringl{font:500 9px var(--f-mono);fill:var(--muted)}
.m-city{font:500 10px var(--f-body);fill:var(--muted)}
.m-cdot{fill:var(--muted)}
.m-route{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
.m-route.help{stroke-dasharray:4 4;opacity:.6}
.m-pin{cursor:pointer}
.m-pin circle{stroke:var(--surface);stroke-width:2}
.m-pin text{font:600 9px var(--f-mono);fill:var(--pin-ink);pointer-events:none}
.m-pin.un circle{fill:var(--surface);stroke:var(--bad);stroke-width:2.5}
.m-pin.un text{fill:var(--bad)}
.m-shop{fill:var(--ink)}
.m-shopl{font:600 10px var(--f-mono);fill:var(--ink)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin-top:10px}
.lg{display:flex;gap:9px;align-items:center;font-size:13px;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:7px 10px}
.lg b{font:700 15px var(--f-display)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--tc);flex:none}

/* ---------- prompts / chart ---------- */
.stack{padding:12px 12px 28px;max-width:680px;margin:0 auto;display:grid;gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.pcard.done{opacity:.62}
.pfrom{font:500 10.5px var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.pcard h3{font:700 22px/1.08 var(--f-display);margin:6px 0 6px}
.pcard p{margin:0 0 12px;color:var(--ink-2)}
.prow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pjob{font:600 12px var(--f-mono);padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.check{margin-left:auto;font:600 13px var(--f-display);text-transform:uppercase;letter-spacing:.05em;padding:7px 11px;border-radius:8px;border:1px solid var(--line)}
.check[aria-pressed="true"]{background:var(--good-soft);color:var(--good);border-color:transparent}
.intro{background:var(--accent-soft);border-radius:14px;padding:14px 16px;font-size:14.5px}
.intro b{font-weight:600}
.chead h3{font:700 19px var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 2px}
.chead p{margin:0 0 8px;color:var(--ink-2);font-size:13.5px}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-2)}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
thead th{font:600 10.5px var(--f-mono);letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
th.on,td.on{background:var(--accent-soft)}
td.src{font:500 11px var(--f-mono);color:var(--muted)}

/* ---------- sheet ---------- */
.sheetback{position:fixed;inset:0;background:rgba(6,18,20,.42);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:640px;margin:0 auto;max-height:86vh;max-height:86dvh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding:0 16px calc(22px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(18px)}to{transform:none}}
.grab{position:sticky;top:0;background:var(--surface);padding:12px 0 10px;display:flex;align-items:flex-start;gap:10px;z-index:2;border-bottom:1px solid var(--line-2)}
.sh-t{flex:1;min-width:0}
.sh-t h3{margin:0;font:700 24px/1.05 var(--f-display)}
.sh-t div{font:500 10.5px/1.5 var(--f-mono);color:var(--muted);margin-top:4px;letter-spacing:.03em}
.sec{padding:12px 0;border-bottom:1px solid var(--line-2)}
.sec:last-child{border-bottom:0}
.sec h4{margin:0 0 8px;font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.lines{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.lines li{display:flex;gap:9px}
.lines li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--tc);margin-top:8px;flex:none}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:600 11px var(--f-mono);padding:4px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);letter-spacing:.02em}
.tag.hot{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.tag.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.tag.dim{color:var(--muted);border-style:dashed}
.kv{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:6px 0}
.kv span{color:var(--ink-2)}
.kv b{font:700 18px var(--f-display)}
.status{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--good-soft);color:var(--good)}
.status b{font:700 18px var(--f-display)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.note{padding:11px 13px;border-radius:10px;background:var(--accent-soft);font-size:14px;margin-top:12px}
.note b{display:block;font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px}
.tchip{flex:none;min-width:116px;border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:11px;padding:7px 10px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.tchip.slim{min-width:0;padding:8px 12px}
.tchip b{font:700 16px/1.1 var(--f-display)}
.tchip span{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.tchip .no{color:var(--bad)}
.tchip .yes{color:var(--good)}
.tchip[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
.tchip:disabled{opacity:.45}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:46px;border-radius:10px;border:1px solid var(--line);font:600 14px var(--f-mono);background:var(--surface-2)}
.stepper output{flex:1;text-align:center;font:700 26px var(--f-display)}
.minis{display:flex;gap:8px;margin-top:8px}
.mini{flex:1;height:40px;border-radius:9px;border:1px solid var(--line);font:600 13px var(--f-display);text-transform:uppercase;letter-spacing:.05em;text-align:center}

/* ---------- results ---------- */
.results{min-height:100vh;min-height:100dvh}
.res{max-width:640px;margin:0 auto;padding:14px 16px 60px;display:grid;gap:22px}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.score{display:flex;align-items:flex-end;gap:10px;margin-top:6px}
.score b{font:700 132px/.78 var(--f-display);letter-spacing:-.02em}
.score span{font:600 24px var(--f-display);color:var(--muted);padding-bottom:6px}
.verdict{font:700 24px var(--f-display);text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:10px 0 0}
.verdict.bad{color:var(--bad)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:128px 1fr 60px;gap:10px;align-items:center}
.bar label{font:600 13.5px var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.track{height:10px;border-radius:5px;background:var(--line-2);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:5px}
.bar output{text-align:right;font:700 19px var(--f-display)}
.bar output small{font:500 12px var(--f-display);color:var(--muted)}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.cmpi span{display:block;font:600 9.5px var(--f-mono);letter-spacing:.07em;color:var(--muted);text-transform:uppercase}

.ded{display:grid;gap:8px}
.di{display:grid;grid-template-columns:40px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line-2);border-radius:11px;padding:10px 12px}
.di > b{font:700 19px/1.15 var(--f-display);color:var(--bad)}
.di.good > b{color:var(--good)}
.di p{margin:0 0 3px;font-size:14px}
.zero{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px 14px}
.zero p{margin:4px 0 0;color:var(--ink)}
.post{display:grid;grid-template-columns:1fr auto;gap:8px}
.lb{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.lbr{display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line-2);align-items:center}
.lbr:last-child{border-bottom:0}

/* ---------- geography ---------- */
function hav(a, b){ const r = Math.PI/180, dLa = (b[0]-a[0])*r, dLo = (b[1]-a[1])*r; const x = Math.sin(dLa/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2; return 12742*Math.asin(Math.sqrt(x)); }
const eastside = p => p[0] > 47.50 && p[0] < 47.78 && p[1] > -122.235;

/* ---------- booking chart ---------- */
const pickCol = (tbl, col) => tbl[col] !== undefined ? tbl[col] : tbl.std;
const colWho = (tbl, col, t) => (tbl[col] !== undefined && col !== 'std') ? t.name + ' column' : 'Standard column';
function areasHours(mkt, n, col){

function chartFor(ctx, j, t){
  const mkt = ctx.sc.market, s = j.scope, col = t.chart || 'std';
  if (j.cat === 'estimate') return {h:1, parts:['estimate 1h']};
  if (j.cat === 'redo') return {h:1.5, parts:['redo 1h 30m']};
  if (j.cat === 'dv'){ const v = mkt === 'AZ' ? 1.5 : (s.dv === 'over10' ? 1.5 : 1); return {h:v, parts:[`dryer vent only ${dur(v*60)}`]}; }
  if (j.cat === 'duct'){
    const tbl = s.pkg === 'Diamond' ? (mkt === 'AZ' ? AZ_DIA : WA_DIA) : (mkt === 'AZ' ? AZ_ESS : WA_ESS);
    const arr = pickCol(tbl, col); const idx = s.sqft <= 1500 ? 0 : Math.ceil((s.sqft-1500)/500);
    const v = idx < arr.length ? arr[idx] : arr[arr.length-1] + 0.5*(idx-arr.length+1);
    return {h:v, parts:[`${s.pkg} ${s.sqft <= 1500 ? '0' : (s.sqft-499).toLocaleString()}–${s.sqft.toLocaleString()} sq ft, ${colWho(tbl, col, t)} ${dur(v*60)}`]};

  if (j.cat === 'carpetcom'){ if (!OTH.commercial) return null; const v = pickCol(OTH.commercial, col); return {h:v, parts:[`commercial, ${colWho(OTH.commercial, col, t)} ${dur(v*60)}`]}; }
  let h = 0; const parts = [];
  const furnMin = Object.entries(s.furn || {}).reduce((n, [k, q]) => n + (PIECE[k] || 10)*q, 0);
  const addOn = (qty, tbl, label) => { if (!qty) return; if (qty < 150 || !tbl){ h += 0.5; parts.push(`${label} add-on 30m`); } else { const v = pickCol(tbl, col); h += v; parts.push(`${label} ${dur(v*60)}`); } };
  if (s.areas > 0){
    const v = areasHours(mkt, s.areas, col); h = v; parts.push(`${s.areas} area${s.areas > 1 ? 's' : ''}, ${colWho(mkt === 'AZ' ? AZ_AREAS : WA_AREAS, col, t)} ${dur(v*60)}`);
    if (furnMin){ h += furnMin/60; parts.push(`furniture pieces ${dur(furnMin)}`); }
    addOn(s.tile, OTH.tile, 'tile'); addOn(s.rug, OTH.rug, 'area rugs'); addOn(s.wood, OTH.wood, 'hardwood');
  } else if (furnMin){
    const whole = pickCol(OTH.furniture, col); h = Math.max(whole, furnMin/60);
    parts.push(furnMin/60 > whole ? `furniture pieces ${dur(furnMin)}` : `furniture job, ${colWho(OTH.furniture, col, t)} ${dur(whole*60)}`);
    addOn(s.tile, OTH.tile, 'tile'); addOn(s.rug, OTH.rug, 'area rugs');
  } else if (s.tile){ h = pickCol(OTH.tile, col); parts.push(`tile, ${colWho(OTH.tile, col, t)} ${dur(h*60)}`); addOn(s.rug, OTH.rug, 'area rugs'); }
  else if (s.rug){ h = pickCol(OTH.rug, col); parts.push(`area rugs in home, ${colWho(OTH.rug, col, t)} ${dur(h*60)}`); }
  else if (s.wood && OTH.wood){ h = pickCol(OTH.wood, col); parts.push(`hardwood, ${colWho(OTH.wood, col, t)} ${dur(h*60)}`); }
  else return null;
  return {h: Math.ceil(h*2 - 1e-9)/2, parts};
}

/* ---------- scenario context ---------- */
const ctxCache = {};
function buildCtx(sc){
  const techs = sc.techs.map((t, i) => Object.assign({}, t, {ci: i % 7, skills: t.skills || [], implied: t.implied || [], blocks: t.blocks || []}));
  const tById = Object.fromEntries(techs.map(t => [t.id, t]));
  sc.jobs.forEach((j, i) => { j._i = i + 1; });
  const jById = Object.fromEntries(sc.jobs.map(j => [j.id, j]));
  const shop = B.markets[sc.market].shop;
  const pts = [shop].concat(sc.jobs.map(j => [j.lat, j.lon]));
  const dm = pts.map(a => pts.map(b => drive(sc.market, a, b)));
  const sec = pts.map((p, i) => i === 0 ? 'Local' : sectorOf(sc.market, sc.jobs[i-1], shop));
  const unavailable = new Set(techs.filter(t => t.blocks.some(b => b.callout)).map(t => t.id));
  return {sc, techs, tById, jobs: sc.jobs, jById, shop, dm, sec, unavailable};
}
const ctxFor = sc => ctxCache[sc.id] || (ctxCache[sc.id] = buildCtx(sc));
function initialAssign(sc){ const a = {}; for (const j of sc.jobs) a[j.id] = {tech: j.tech || null, helper: j.helper || null, start: j.start, dur: j.dur}; return a; }

/* ---------- scoring ---------- */
function evaluate(ctx, assign, lite){

  const add = (k, pts, key, text, job, tech) => items.push({k, pts, key, text: lite ? '' : text(), job: job || null, tech: tech || null});
  const exp = {}, chartMap = {};
  for (const j of ctx.jobs){ const a = assign[j.id]; const lead = a.tech ? ctx.tById[a.tech] : null; const c = lead ? chartFor(ctx, j, lead) : null; chartMap[j.id] = c; exp[j.id] = c ? c.h*60 : a.dur; }
  const byTech = {}; ctx.techs.forEach(t => { byTech[t.id] = []; });
  for (const j of ctx.jobs){
    const a = assign[j.id];
    if (!a.tech || !ctx.tById[a.tech]){ lost.push({job: j.id, why: 'No tech assigned'}); continue; }
    if (ctx.unavailable.has(a.tech)){ lost.push({job: j.id, why: `${ctx.tById[a.tech].name} called out`}); continue; }
    byTech[a.tech].push(j);
    if (a.helper && a.helper !== a.tech && ctx.tById[a.helper] && !ctx.unavailable.has(a.helper)) byTech[a.helper].push(j);
  }

    const list = byTech[t.id].sort((x, y) => (assign[x.id].start - assign[y.id].start) || (x._i - y._i));
    let clk = DEPART, li = 0, prevSec = null, td = 0; const seq = [];

      const arr = Math.max(a.start, clk + dr), end = arr + exp[j.id], lead = a.tech === t.id;
      seq.push({job: j, arr, end, dr, lead}); td += dr;
      const s = ctx.sec[j._i]; if (prevSec && isCross(mkt, prevSec, s)) crossings++; prevSec = s;
      clk = end; li = j._i; if (lead) recs[j.id] = {arr, end, dr};
    }
    if (list.length) td += ctx.dm[li][0];

      } else add('skills', -10, 'skill', () => `${lead.name} doesn't have ${missing.join(' or ')} in ServiceTitan.`, j.id, lead.id);
    }
    if (j.tags.includes('! NO WATER HOOK UP') && !lead.water) add('skills', -8, 'water', () => `No water hookup at this house, and ${lead.name}'s truck doesn't carry water.`, j.id, lead.id);
    if (j.tags.includes('! Portable') && !lead.portable) add('skills', -8, 'portable', () => `Portable job, and ${lead.name}'s truck isn't set up for portable work.`, j.id, lead.id);
    if (j.scope.crb && !lead.crb) add('skills', -8, 'crb', () => `FiberRevive needs a CRB machine. ${lead.name} doesn't have one.`, j.id, lead.id);

    if (j.cat === 'redo' && lead.pay === 'Commission') add('skills', -4, 'redo', () => `Redos go to hourly techs. ${lead.name} is commission-only.`, j.id, lead.id);

      else add('sop', -4, 'window', () => `Booked at ${clock(a.start)}, outside the ${clock(j.win[0])}–${clock(j.win[1])} window the customer ${j.isNew ? 'asked for' : 'was promised'}.`, j.id);

      }

function scoreOf(ev, bd){

/* ---------- best-board search (deterministic, cached per phone) ---------- */
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

const benchCache = {};
function benchFor(ctx){
  const id = ctx.sc.id, key = 'dd-bench-v5-' + id;
  if (benchCache[id]) return benchCache[id];
  const cached = store.get(key, null);
  if (cached && cached.assign && ctx.jobs.every(j => cached.assign[j.id])) return (benchCache[id] = Promise.resolve({assign: cached.assign, ev: evaluate(ctx, cached.assign)}));
  return (benchCache[id] = new Promise(resolve => {
    const rng = mulberry32(hashStr(id));
    const avail = ctx.techs.filter(t => !ctx.unavailable.has(t.id)).map(t => t.id);
    const lists = {}; avail.forEach(t => { lists[t] = []; });
    ctx.jobs.slice().sort((x, y) => x.start - y.start).forEach(j => { const t = (j.tech && lists[j.tech]) ? j.tech : avail[Math.floor(rng()*avail.length)]; lists[t].push(j.id); });
    const decode = L => {
      const a = {};
      for (const tid of avail){
        const t = ctx.tById[tid]; let clk = DEPART, li = 0;
        for (const id of L[tid]){
          const j = ctx.jById[id], dr = ctx.dm[li][j._i], earliest = clk + dr;
          const st = j.tags.includes('! Do not Move') ? j.start : Math.max(j.win[0], Math.ceil(earliest/15)*15);
          const c = chartFor(ctx, j, t), d = c ? Math.round(c.h*60) : j.dur;
          a[id] = {tech: tid, helper: null, start: st, dur: d}; clk = Math.max(st, earliest) + d; li = j._i;
        }
      }
      return a;
    };
    const cost = L => { const ev = evaluate(ctx, decode(L), true); return ev.driveTotal + 7*(ev.skillsDed + ev.sopDed) + 10*ev.crossings + 500*ev.lost.length; };
    const clone = L => { const o = {}; for (const k in L) o[k] = L[k].slice(); return o; };
    const mutate = L => {
      const c = clone(L), r = rng(), full = avail.filter(t => c[t].length);
      const any = arr => arr[Math.floor(rng()*arr.length)];
      if (r < 0.55){ const from = any(full); const [id] = c[from].splice(Math.floor(rng()*c[from].length), 1); const to = any(avail); c[to].splice(Math.floor(rng()*(c[to].length + 1)), 0, id); }
      else if (r < 0.85){ const t1 = any(full), t2 = any(full); const i = Math.floor(rng()*c[t1].length), k = Math.floor(rng()*c[t2].length); const tmp = c[t1][i]; c[t1][i] = c[t2][k]; c[t2][k] = tmp; }
      else { const t = any(full), n = c[t].length; if (n > 1){ let i = Math.floor(rng()*n), k = Math.floor(rng()*n); if (i > k) [i, k] = [k, i]; const seg = c[t].slice(i, k + 1).reverse(); c[t].splice(i, seg.length, ...seg); } }
      return c;
    };
    let cur = lists, curC = cost(cur), best = clone(cur), bestC = curC, it = 0;
    const N = 16000, T0 = 90, T1 = 0.5;
    const step = () => {
      const stop = Math.min(N, it + 800);
      for (; it < stop; it++){
        const T = T0*Math.pow(T1/T0, it/N), cand = mutate(cur), cc = cost(cand);
        if (cc < curC || rng() < Math.exp((curC - cc)/T)){ cur = cand; curC = cc; if (cc < bestC){ best = clone(cand); bestC = cc; } }
      }
      if (it < N) setTimeout(step, 0);
      else { const assign = decode(best); store.set(key, {assign}); resolve({assign, ev: evaluate(ctx, assign)}); }
    };
    setTimeout(step, 40);
  }));
}

/* ---------- game ---------- */
let S = null;
function show(which){ ['home','game','results'].forEach(id => { $('#' + id).hidden = id !== which; }); if (which !== 'game'){ closeSheet(true); } }
function play(id){
  const sc = B.scenarios.find(s => s.id === id), ctx = ctxFor(sc);
  const assign = initialAssign(sc), saved = store.get('dd-assign-' + id, null);
  if (saved) for (const k in assign) if (saved[k]) assign[k] = Object.assign(assign[k], saved[k]);
  S = {ctx, sc, assign, view: 'board', sheet: null, revealed: store.get('dd-revealed-' + id, false), handled: store.get('dd-handled-' + id, {}), posted: false};
  S.benchP = benchFor(ctx);

}
function commit(){ store.set('dd-assign-' + S.sc.id, S.assign); renderGame(); }
function read(label, val, alert){ return `<div class="read${alert ? ' alert' : ''}"><span>${label}</span><b>${val}</b></div>`; }
function renderGame(){
  if (!S) return;

  const tabs = [['board','Board'],['map','Map'],['prompts','Prompts'],['chart','Chart']];
  $('#tabs').innerHTML = tabs.map(([v, l]) => `<button class="tab" role="tab" data-act="tab" data-v="${v}" aria-selected="${S.view === v}">${l}${v === 'prompts' && open ? `<i>${open}</i>` : ''}</button>`).join('');
  const main = $('#gmain'), sl = main.scrollLeft, st = main.scrollTop, same = main.dataset.view === S.view;
  main.dataset.view = S.view;
  main.innerHTML = S.view === 'board' ? renderBoard(ev) : S.view === 'map' ? renderMap(ev) : S.view === 'prompts' ? renderPrompts() : renderChart();
  if (same){ main.scrollLeft = sl; main.scrollTop = st; } else { main.scrollTop = 0; main.scrollLeft = S.view === 'board' ? 0 : 0; }
  renderSheet();
}
function shortScope(j){
  const s = j.scope;
  if (j.cat === 'duct') return `${s.pkg} ${s.sqft <= 1500 ? '≤1,500' : (s.sqft-499).toLocaleString() + '–' + s.sqft.toLocaleString()}${s.dvAddon ? ' + DV' : ''}`;
  if (j.cat === 'dv') return 'Dryer vent only';
  if (j.cat === 'ductcom' || j.cat === 'carpetcom') return j.lines[0];
  if (j.cat === 'service') return 'Service manager visit';
  if (j.cat === 'estimate') return 'Estimate';
  if (j.cat === 'redo') return 'Redo';
  const p = []; if (s.areas) p.push(`${s.areas} area${s.areas > 1 ? 's' : ''}`);
  const fn = Object.values(s.furn || {}).reduce((a, b) => a + b, 0); if (fn) p.push(`${fn} furniture pc`);
  if (s.tile) p.push('tile'); if (s.rug) p.push('rugs'); if (s.wood) p.push('hardwood'); if (s.deepcore) p.push('DeepCore'); if (s.crb) p.push('CRB');

const tcol = t => t ? `var(--t${t.ci})` : 'var(--bad)';
function renderBoard(ev){
  const ctx = S.ctx, A = S.assign, laneW = Math.round((DAY1 - DAY0)*PX), hour = 60*PX;
  const late = {}; ev.items.forEach(i => { if (i.key === 'late' && i.job) late[i.job] = true; });
  let tray = '';
  if (ev.lost.length){
    tray = `<div class="tray"><div class="tray-h">Needs a tech · ${ev.lost.length}</div><div class="tray-list">${ev.lost.map(l => { const j = ctx.jById[l.job]; return `<button class="jchip" data-act="job" data-id="${j.id}"><b>${j.id} · ${esc(j.city)}${j.isNew ? '<em class="new">NEW</em>' : ''}</b><span>${esc(l.why)}</span><span>${esc(shortScope(j))} · ${shortT(j.win[0])}–${shortT(j.win[1])}</span></button>`; }).join('')}</div></div>`;
  }
  let ticks = ''; for (let m = DAY0; m < DAY1; m += 60) ticks += `<span class="tick" style="left:${(m - DAY0)*PX}px">${shortT(m)}</span>`;

    if (t.hardStop && t.hardStop.dow === S.sc.dow) h += `<div class="stop" style="left:${(t.hardStop.min - DAY0)*PX}px"><span>HARD STOP</span></div>`;
    for (const j of ctx.jobs){

      const lead = a.tech === t.id;
      if (lead) h += `<div class="win" style="left:${(j.win[0] - DAY0)*PX}px;width:${Math.max(4, (j.win[1] - j.win[0])*PX)}px"></div>`;

  <div class="key"><span><i class="sw" style="background:var(--t0);opacity:.7"></i>When the tech is really there, using the booking chart</span><span><i class="sw" style="background:repeating-linear-gradient(135deg,var(--bad) 0 3px,transparent 3px 6px)"></i>Runs past what's booked</span><span><i class="sw" style="background:var(--window)"></i>Customer's arrival window</span><span>Tap a tech's name for skills and blocks</span></div>`;
}

function renderMap(ev){
  const ctx = S.ctx, W = 360, H = 440, pad = 30, mkt = S.sc.market;
  const pts = [ctx.shop].concat(ctx.jobs.map(j => [j.lat, j.lon]));

  const k = Math.min((W - 2*pad)/Math.max(1e-6, x1 - x0), (H - 2*pad)/Math.max(1e-6, y1 - y0));
  const ox = (W - (x1 - x0)*k)/2, oy = (H - (y1 - y0)*k)/2;
  const P = p => [ox + (X(p) - x0)*k, oy + (Y(p) - y0)*k];
  const m = B.model[mkt], [sx, sy] = P(ctx.shop);
  let svg = `<rect width="${W}" height="${H}" fill="var(--surface)"/>`;
  for (const mm of [30, 45, 60]){ const km = Math.pow(Math.max(0, (mm - m.a)/m.b), 1/m.p), r = km*k/111.32; svg += `<circle class="m-ring" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${r.toFixed(1)}"/><text class="m-ringl" x="${(sx + r*0.72 + 3).toFixed(1)}" y="${(sy - r*0.70).toFixed(1)}">${mm} min</text>`; }
  const placed = [];
  B.zones.filter(z => z.m === mkt).sort((a, b) => b.jobs - a.jobs).forEach(z => {
    if (placed.length >= 14) return; const [cx, cy] = P([z.lat, z.lon]);

    placed.push([cx, cy]); svg += `<circle class="m-cdot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="1.6"/><text class="m-city" x="${cx.toFixed(1)}" y="${(cy + 12).toFixed(1)}" text-anchor="middle">${esc(z.city)}</text>`;
  });
  for (const t of ctx.techs){
    const pt = ev.perTech[t.id]; if (!pt || !pt.seq.length) continue;
    const lead = [ctx.shop].concat(pt.seq.map(s => [s.job.lat, s.job.lon])).concat([ctx.shop]).map(P).map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
    svg += `<polyline class="m-route${pt.seq.every(s => !s.lead) ? ' help' : ''}" points="${lead}" style="stroke:${tcol(t)}"/>`;
  }
  svg += `<rect class="m-shop" x="${(sx - 7).toFixed(1)}" y="${(sy - 7).toFixed(1)}" width="14" height="14" rx="3"/><text class="m-shopl" x="${(sx + 11).toFixed(1)}" y="${(sy + 4).toFixed(1)}">SHOP</text>`;
  const lostSet = new Set(ev.lost.map(l => l.job));
  for (const j of ctx.jobs){
    const [cx, cy] = P([j.lat, j.lon]), a = S.assign[j.id], t = a.tech ? ctx.tById[a.tech] : null, un = lostSet.has(j.id);
    svg += `<g class="m-pin${un ? ' un' : ''}" data-act="job" data-id="${j.id}" role="button" tabindex="0" aria-label="${esc(j.id + ' ' + j.city)}"><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="10" style="fill:${tcol(t)}"/><text x="${cx.toFixed(1)}" y="${(cy + 3).toFixed(1)}" text-anchor="middle">${j.id.slice(1)}</text></g>`;

  return `<div class="mapwrap"><svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of today's jobs and routes from the ${esc(B.markets[mkt].shopName)}">${svg}</svg>
    <p class="foot" style="margin:8px 2px 0">Dashed rings are drive time from the shop. Lines follow each tech's booked order. Tap a pin to open the job.</p>
    <div class="legend">${legend}</div></div>`;
}

function renderPrompts(){

/* ---------- sheet ---------- */
function openJob(id){ S.sheet = {job: id}; renderGame(); }

function renderSheet(){
  const sh = $('#sheet'), back = $('#sheetBack');
  if (!S || !S.sheet){ sh.hidden = true; back.hidden = true; return; }
  const top = sh.hidden ? 0 : sh.scrollTop;
  sh.innerHTML = S.sheet.job ? jobSheet(S.sheet.job) : techSheet(S.sheet.tech);
  sh.hidden = false; back.hidden = false; sh.scrollTop = top;
}
function priorJob(tid, j){
  let prev = null;
  for (const k of S.ctx.jobs){ if (k.id === j.id) continue; const b = S.assign[k.id]; if (b.tech !== tid && b.helper !== tid) continue; if (b.start <= S.assign[j.id].start && (!prev || b.start > S.assign[prev.id].start)) prev = k; }
  return prev;
}
function fitAfter(id){
  const ctx = S.ctx, j = ctx.jById[id], a = S.assign[id]; if (!a.tech) return a.start;
  const prev = priorJob(a.tech, j);
  const earliest = prev ? S.assign[prev.id].start + S.assign[prev.id].dur + ctx.dm[prev._i][j._i] : DEPART + ctx.dm[0][j._i];
  return clamp(Math.max(j.win[0], Math.ceil(earliest/15)*15), DAY0, DAY1 - 30);
}
function jobSheet(id){
  const ctx = S.ctx, ev = S.ev, j = ctx.jById[id], a = S.assign[id], lead = a.tech ? ctx.tById[a.tech] : null, out = lead && ctx.unavailable.has(lead.id);

  else { const promised = a.start > j.win[1] ? a.start : j.win[1], isLate = r.arr > promised + 5; status = `<div class="status${isLate ? ' bad' : ''}"><span>${esc(lead.name)} gets there</span><b>${clock(r.arr)}${isLate ? ` · ${dur(r.arr - promised)} late` : ''}</b></div>`; }
  const tags = j.tags.map(t => `<span class="tag${HOT_TAGS.includes(t) ? ' hot' : ''}">${esc((TAGS[t] || [t])[0])}</span>`).join('');
  const have = lead ? new Set(lead.skills.concat(lead.implied)) : null;
  const req = j.req.map(x => have ? `<span class="tag ${have.has(x) ? 'ok' : 'hot'}">${have.has(x) ? '✓' : '✗'} ${esc(x)}</span>` : `<span class="tag">${esc(x)}</span>`).join('');
  const equip = []; if (j.tags.includes('! NO WATER HOOK UP')) equip.push('Water on the truck'); if (j.tags.includes('! Portable')) equip.push('Portable setup'); if (j.scope.crb) equip.push('CRB machine'); if (j.commercialCustomer || j.cat === 'carpetcom' || j.cat === 'ductcom') equip.push('Commercial customer');
  const techChips = ctx.techs.map(t => {
    const tout = ctx.unavailable.has(t.id), hv = new Set(t.skills.concat(t.implied)), miss = j.req.filter(x => !hv.has(x));
    const prev = priorJob(t.id, j), d = prev ? `${ctx.dm[prev._i][j._i]}m from ${prev.city}` : `${ctx.dm[0][j._i]}m from shop`;
    return `<button class="tchip" style="--tc:${tcol(t)}" data-act="assign" data-tech="${t.id}" aria-pressed="${a.tech === t.id}"${tout ? ' disabled' : ''}><b>${esc(t.name)}</b><span class="${miss.length ? 'no' : 'yes'}">${tout ? 'Called out' : miss.length ? `✗ missing ${miss.length}` : '✓ has skills'}</span><span>${tout ? '&nbsp;' : esc(d)}</span></button>`;
  }).join('') + `<button class="tchip" style="--tc:var(--bad)" data-act="assign" data-tech="" aria-pressed="${!a.tech}"><b>Unassign</b><span>Leaves it in the tray</span><span>&nbsp;</span></button>`;
  const helperChips = `<button class="tchip slim" style="--tc:var(--line)" data-act="helper" data-tech="" aria-pressed="${!a.helper}"><b>None</b></button>` + ctx.techs.filter(t => t.id !== a.tech).map(t => `<button class="tchip slim" style="--tc:${tcol(t)}" data-act="helper" data-tech="${t.id}" aria-pressed="${a.helper === t.id}"${ctx.unavailable.has(t.id) ? ' disabled' : ''}><b>${esc(t.name)}</b></button>`).join('');
  return `<div class="grab"><div class="sh-t"><h3>${esc(j.customer)}</h3><div>${j.id} · ${esc(j.city)} · ${esc(j.type)}${j.invoice ? ` · $${j.invoice.toLocaleString()} invoiced` : ''}</div></div><button class="iconbtn" data-act="close" aria-label="Close">×</button></div>
  <div class="sec">${status}<div class="kv"><span>Arrival window</span><b>${clock(j.win[0])} – ${clock(j.win[1])}</b></div>${tags ? `<div class="tagrow">${tags}</div>` : ''}${j.training ? `<div class="note"><b>Job summary</b>${esc(j.training.text)}</div>` : ''}</div>
  <div class="sec" style="--tc:${tcol(lead)}"><h4>${j.isNew ? 'Booked work' : 'Invoiced work'}</h4><ul class="lines">${j.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>
  <div class="sec"><h4>Needs</h4><div class="tagrow">${req}${equip.map(e => `<span class="tag">${esc(e)}</span>`).join('')}</div></div>
  <div class="sec"><h4>Tech</h4><div class="chips">${techChips}</div></div>
  <div class="sec"><h4>Ride-along trainer <span>optional</span></h4><div class="chips">${helperChips}</div></div>
  <div class="sec"><h4>Start time</h4><div class="stepper"><button data-act="start" data-d="-15" aria-label="15 minutes earlier">−15</button><output>${clock(a.start)}</output><button data-act="start" data-d="15" aria-label="15 minutes later">+15</button></div>
    <div class="minis"><button class="mini" data-act="fit">After previous job</button><button class="mini" data-act="winstart">Window start</button></div></div>
  <div class="sec"><h4>Booked length <button class="linkbtn" data-act="tab" data-v="chart">Booking chart</button></h4><div class="stepper"><button data-act="dur" data-d="-30" aria-label="30 minutes shorter">−30</button><output>${dur(a.dur)}</output><button data-act="dur" data-d="30" aria-label="30 minutes longer">+30</button></div></div>`;
}
function techSheet(id){
  const t = S.ctx.tById[id], pt = S.ev.perTech[id], out = S.ctx.unavailable.has(id);
  const payNote = {Commission:'Commission-only. A gap is money out of their pocket, so fill their board first and keep redos and no-charge work off it.', Hourly:'Hourly. Paid either way, so this is the place for filler, redos, commercial and low-ticket work.', Salary:'Salary. Estimates, commercial and rescues.'}[t.pay] || '';
  const rules = [];
  if (t.maxJobs) rules.push(`Board blocked at ${t.maxJobs} jobs a day.`);
  if (t.hardStop) rules.push(`${t.hardStop.label}.`);
  if ((t.rules || []).includes('residential_only')) rules.push('Residential only. No commercial, HOA, condo or property-management carpet.');
  (t.notes || []).forEach(n => rules.push(n));
  const blocks = t.blocks.map(b => `<li>${clock(b.start)}–${clock(b.end)} · ${esc(b.label)}</li>`).join('');
  const n = pt ? pt.seq.filter(s => s.lead).length : 0;
  return `<div class="grab" style="--tc:${tcol(t)}"><div class="sh-t"><h3>${esc(t.full || t.name)}</h3><div>${esc(t.title)} · ${esc(t.pay).toUpperCase()}</div></div><button class="iconbtn" data-act="close" aria-label="Close">×</button></div>
  <div class="sec"><div class="kv"><span>Today</span><b>${out ? 'Called out' : `${n} job${n === 1 ? '' : 's'} · ${dur(pt ? pt.drive : 0)} driving`}</b></div>${pt && pt.lastEnd ? `<div class="kv"><span>Last job wraps</span><b>${clock(pt.lastEnd)}</b></div>` : ''}<div class="kv"><span>Booking chart column</span><b>${COLNAME[t.chart] || 'Standard'}</b></div><p style="margin:6px 0 0;color:var(--ink-2);font-size:14px">${payNote}</p></div>
  <div class="sec"><h4>Skills in ServiceTitan</h4><div class="tagrow">${t.skills.map(s => `<span class="tag">${esc(s)}</span>`).join('') || '<span class="tag dim">None listed</span>'}${t.implied.map(s => `<span class="tag dim">${esc(s)} · from department</span>`).join('')}</div></div>
  <div class="sec"><h4>Truck &amp; equipment</h4><div class="tagrow"><span class="tag ${t.water ? 'ok' : ''}">${t.water ? '✓ Water on board' : 'No water on truck'}</span><span class="tag ${t.portable ? 'ok' : ''}">${t.portable ? '✓ Portable-capable' : 'No portable work'}</span><span class="tag ${t.crb ? 'ok' : ''}">${t.crb ? '✓ CRB machine' : 'No CRB machine'}</span></div>${t.truck ? `<p style="margin:8px 0 0;font:500 11px var(--f-mono);color:var(--muted)">Dispatch team: ${esc(t.truck)}</p>` : ''}</div>
  ${rules.length ? `<div class="sec"><h4>Standing rules</h4><ul class="plist">${rules.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
  <div class="sec"><h4>Dispatch blocks today</h4>${blocks ? `<ul class="plist">${blocks}</ul>` : '<p style="margin:0;color:var(--ink-2)">None.</p>'}</div>`;
}

/* ---------- results ---------- */
async function lock(){
  closeSheet(true);
  show('results'); window.scrollTo(0, 0);
  $('#results').innerHTML = `<div class="res"><p class="eyebrow">${esc(S.sc.title)} · ${esc(S.sc.dateLabel)}</p><div class="verdict">Scoring your board…</div><p>Finding the best board for this day to score against. This takes a few seconds the first time.</p></div>`;
  const bench = await S.benchP; renderResults(bench);
}
function renderResults(bench){
  const ctx = S.ctx, ev = evaluate(ctx, S.assign), bd = bench.ev, sc = scoreOf(ev, bd), booked = evaluate(ctx, initialAssign(S.sc), true);
  S.lastScore = sc; S.lastEv = ev;
  if (!S.revealed){ const k = 'dd-best-' + S.sc.id, prev = store.get(k, null); if (prev == null || sc.total > prev) store.set(k, sc.total); }
  const verdict = sc.zero ? 'Lost job' : sc.total >= 90 ? 'Dispatch ready' : sc.total >= 75 ? 'Solid board' : sc.total >= 50 ? 'Needs a second look' : 'Rebuild this board';
  const bar = (label, v, max) => `<div class="bar"><label>${label}</label><div class="track"><div class="fill" style="width:${(100*v/max).toFixed(0)}%"></div></div><output>${v}<small>/${max}</small></output></div>`;
  const item = i => `<div class="di${i.pts >= 0 ? ' good' : ''}"><b>${i.pts >= 0 ? '✓' : i.pts}</b><div><p>${esc(i.text)}</p>${i.job ? `<button class="linkbtn" data-act="gojob" data-id="${i.job}">Show ${i.job} on the board</button>` : i.tech ? `<button class="linkbtn" data-act="gotech" data-id="${i.tech}">Open ${esc(ctx.tById[i.tech].name)}'s day</button>` : ''}</div></div>`;
  const skills = ev.items.filter(i => i.k === 'skills' && i.pts < 0), sop = ev.items.filter(i => i.k === 'sop' && i.pts < 0), goods = ev.items.filter(i => i.pts >= 0);
  const pct = Math.round(100*sc.over);
  const routingLine = ev.driveTotal <= bd.driveTotal ? `Your techs drive ${dur(ev.driveTotal)}, as tight as the best board found.` : `Your techs drive ${dur(ev.driveTotal)}. That's ${pct}% more than the best board found (${dur(bd.driveTotal)}).`;
  const crossLine = S.sc.market === 'WA' ? ` Zone crossings: yours ${ev.crossings}, best board ${bd.crossings}.` : '';
  const carry = (bd.skillsDed || bd.sopDed) ? `<p>The best board for this day still carries −${bd.skillsDed} in skills and −${bd.sopDed} in SOP. Some problems can't be fixed today, so you're only charged past that.</p>` : '';
  const name = store.get('dd-name', '');
  const opts = ['<option value="">Pick your name</option>'].concat(CCRS.map(n => `<option${n === name ? ' selected' : ''}>${esc(n)}</option>`)).join('');
  $('#results').innerHTML = `${S.revealed ? '<div class="banner">You opened the best board on this attempt, so this score won\'t post.</div>' : ''}<div class="res">
    <div class="rtop"><button class="btn" data-act="back">‹ Keep editing</button><p class="eyebrow">${esc(S.sc.title)} · ${esc(S.sc.dateLabel)}</p></div>
    <div><div class="score"><b>${sc.total}</b><span>/ 100</span></div><div class="verdict${sc.zero || sc.total < 50 ? ' bad' : ''}">${verdict}</div></div>
    ${sc.zero ? `<div class="zero"><b>A job has no tech going out, so the board scores 0.</b>${ev.lost.map(l => `<p>${l.job} · ${esc(ctx.jById[l.job].city)}: ${esc(l.why)}. <button class="linkbtn" data-act="gojob" data-id="${l.job}">Fix it</button></p>`).join('')}</div>` : ''}
    <div class="bars">${bar('Routing', sc.routing, 40)}${bar('Skills', sc.skills, 30)}${bar('SOP &amp; timing', sc.sop, 30)}</div>
    <div class="cmp"><div class="cmpi you"><span>Your board</span><b>${dur(ev.driveTotal)}</b></div><div class="cmpi"><span>As booked</span><b>${dur(booked.driveTotal)}</b></div><div class="cmpi"><span>Best found</span><b>${dur(bd.driveTotal)}</b></div></div>
    <section class="rsec"><h3>Routing</h3><p>${routingLine}${crossLine}</p></section>
    ${skills.length ? `<section class="rsec"><h3>Skills &amp; equipment</h3><div class="ded">${skills.map(item).join('')}</div></section>` : ''}
    ${sop.length ? `<section class="rsec"><h3>SOP &amp; timing</h3>${carry}<div class="ded">${sop.map(item).join('')}</div></section>` : (carry ? `<section class="rsec"><h3>SOP &amp; timing</h3>${carry}</section>` : '')}
    ${goods.length ? `<section class="rsec"><h3>Done right</h3><div class="ded">${goods.map(item).join('')}</div></section>` : ''}
    <section class="rsec"><h3>Leaderboard</h3>
      ${S.revealed ? '<p>Reset the board to play for a score that posts.</p>' : `<div class="post"><select id="who2" aria-label="Your name">${opts}</select><button class="btn" data-act="post" id="postBtn"${S.posted ? ' disabled' : ''}>${S.posted ? 'Posted' : 'Post score'}</button></div>`}
      <div class="lb" id="lb"><p class="lbempty">Loading scores…</p></div></section>
    <div class="ractions"><button class="btn" data-act="reveal">Show the best board</button><button class="btn" data-act="reset" id="resetBtn2">Reset and replay</button></div>
  </div>`;
  loadLeaderboard();
}
async function loadLeaderboard(){
  const el = $('#lb'); if (!el) return;
  const best = store.get('dd-best-' + S.sc.id, null);
  const db = await getDb();
  if (!db){ el.innerHTML = `<p class="lbempty">The team leaderboard isn't available in this view. Your best on this phone: ${best == null ? '–' : best}.</p>`; return; }
  try {
    const snap = await db.collection('scores').where('scenario', '==', S.sc.id).orderBy('score', 'desc').limit(10).get();
    if (snap.empty){ el.innerHTML = '<p class="lbempty">No scores posted yet. Be the first.</p>'; return; }
    el.innerHTML = snap.docs.map((d, i) => { const x = d.data() || {}; return `<div class="lbr"><i>${i + 1}</i><div>${esc(x.name || 'Unnamed')}<small>Routing ${x.routing ?? '–'} · Skills ${x.skills ?? '–'} · SOP ${x.sop ?? '–'}</small></div><b>${esc(x.score)}</b></div>`; }).join('');
  } catch (e){ el.innerHTML = '<p class="lbempty">Scores couldn\'t load right now. Try again in a minute.</p>'; }
}
async function postScore(){
  const sel = $('#who2'), name = sel ? sel.value : '', btn = $('#postBtn');
  if (!name){ if (sel) sel.focus(); btn.textContent = 'Pick your name first'; return; }
  store.set('dd-name', name);
  const db = await getDb();
  if (!db){ btn.textContent = 'Leaderboard unavailable'; btn.disabled = true; return; }
  const sc = S.lastScore, ev = S.lastEv;
  const rec = {name, scenario: S.sc.id, score: sc.total, routing: sc.routing, skills: sc.skills, sop: sc.sop, driveMin: ev.driveTotal, at: new Date().toISOString(), v: 1};
  btn.disabled = true; btn.textContent = 'Posting…';
  const tryAdd = () => db.collection('scores').add(rec);
  try { await tryAdd(); }
  catch (e){
    if (e && e.code === 'unavailable'){ await new Promise(r => setTimeout(r, 600 + Math.random()*800)); try { await tryAdd(); } catch (e2){ btn.disabled = false; btn.textContent = 'Couldn\'t post. Try again'; return; } }
    else { btn.disabled = false; btn.textContent = e && e.code === 'quota_exceeded' ? 'Leaderboard is full' : 'Couldn\'t post. Try again'; return; }
  }
  S.posted = true; btn.textContent = 'Posted'; loadLeaderboard();
}

/* ---------- events ---------- */
function resetBoard(){
  store.del('dd-assign-' + S.sc.id); store.del('dd-revealed-' + S.sc.id); store.del('dd-handled-' + S.sc.id);
  S.assign = initialAssign(S.sc); S.revealed = false; S.handled = {}; S.posted = false; S.sheet = null;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const cur = S && S.sheet && S.sheet.job ? S.assign[S.sheet.job] : null;
  switch (act){
    case 'play': play(id); break;
    case 'home': S = null; show('home'); renderHome(); window.scrollTo(0, 0); break;
    case 'tab': S.view = el.dataset.v; S.sheet = null; renderGame(); break;
    case 'job': openJob(id); break;
    case 'tech': S.sheet = {tech: id}; renderSheet(); break;
    case 'close': closeSheet(false); break;
    case 'assign': if (cur){ const tid = el.dataset.tech || null; cur.tech = tid; if (cur.helper === tid) cur.helper = null; commit(); } break;
    case 'helper': if (cur){ cur.helper = el.dataset.tech || null; commit(); } break;
    case 'start': if (cur){ cur.start = clamp(cur.start + Number(el.dataset.d), DAY0, DAY1 - 30); commit(); } break;
    case 'dur': if (cur){ cur.dur = clamp(cur.dur + Number(el.dataset.d), 30, 720); commit(); } break;
    case 'fit': if (cur){ cur.start = fitAfter(S.sheet.job); commit(); } break;
    case 'winstart': if (cur){ cur.start = S.ctx.jById[S.sheet.job].win[0]; commit(); } break;
    case 'handled': S.handled[el.dataset.p] = !S.handled[el.dataset.p]; store.set('dd-handled-' + S.sc.id, S.handled); renderGame(); break;
    case 'lock': lock(); break;
    case 'back': show('game'); renderGame(); break;
    case 'gojob': show('game'); S.view = 'board'; openJob(id); break;
    case 'gotech': show('game'); S.view = 'board'; S.sheet = {tech: id}; renderGame(); break;
    case 'reveal': S.benchP.then(b => { S.assign = JSON.parse(JSON.stringify(b.assign)); S.revealed = true; store.set('dd-revealed-' + S.sc.id, true); store.set('dd-assign-' + S.sc.id, S.assign); show('game'); S.view = 'board'; renderGame(); }); break;
    case 'reset':
      if (el.dataset.armed !== '1'){ el.dataset.armed = '1'; el.textContent = 'Tap again to reset'; setTimeout(() => { if (el.isConnected){ el.dataset.armed = ''; el.textContent = el.id === 'resetBtn2' ? 'Reset and replay' : 'Reset'; } }, 3000); break; }
      el.dataset.armed = ''; resetBoard(); show('game'); S.view = 'board'; renderGame(); break;
    case 'post': postScore(); break;
  }
});
document.addEventListener('change', e => { if (e.target.id === 'who' || e.target.id === 'who2') store.set('dd-name', e.target.value); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S && S.sheet) closeSheet(false);
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('m-pin')){ e.preventDefault(); openJob(e.target.dataset.id); }
});

renderHome();
})();
</script>

</body></html>
